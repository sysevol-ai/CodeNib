skill_id: find_callers
skill_type: expand
operator: graph.walk
cost: low
defaults:
  top_k: 40
inputs:
  - name: symbol
    type: str
    required: true
    description: Function/class name to find callers of (fuzzy-matched; ambiguity returns candidates).
outputs:
  type: List[QueriedNode]
  description: Compact list of callers (name, file:line, kind). No code bodies — read the ones you need.
index_requirements:
  - type: symbol_graph
    max_age_seconds: 3600
    scope: current_repo
resources: []
