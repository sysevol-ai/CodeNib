skill_id: embedding_search
skill_type: retrieval
operator: faiss.retrieve
cost: high

defaults:
  top_k: 20
  level: l2
  return_content: true

inputs:
  - name: query
    type: str
    required: true
    description: Search query
  - name: top_k
    type: int
    required: false
    default: 20
  - name: level
    type: str
    required: false
    default: l2
    description: "Hierarchy level: l0 (file skeletons) or l2 (functions/methods)"
  - name: return_content
    type: bool
    required: false
    default: true
  - name: score_threshold
    type: float
    required: false
    default: null
    description: Minimum similarity score to include a result
  - name: mask_name
    type: str
    required: false
    default: null
    description: Named mask to restrict search to a subset of node IDs

outputs:
  type: List[QueriedNode]

index_requirements:
  - type: vector
    max_age_seconds: 3600
    scope: current_repo

resources:
  - GPU
