<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vite emits relative asset references so the static exporter can remount
      the bundle below a Pages base path. Live API deployments serve routes
      such as /<repo>/ask directly, where those references otherwise resolve
      below the route and 404. The exporter strips this tag before rewriting
      the same references to its configured mount path.
    -->
    <base href="/" />
    <meta
      name="description"
      content="Understand a repo. Follow the code. Explore a real example without an account, then open or generate a source-linked repository Wiki."
    />
    <link rel="icon" href="/codenib-icon.svg" />
    <title>CodeNib Wiki · Source-linked repository docs</title>
    <meta property="og:title" content="CodeNib Wiki · Understand a repo. Follow the code." />
    <meta property="og:description" content="Explore a real question, follow indexed calls to their source, and keep reading the complete Wiki." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://codenib.ai/assets/explore/requests-card.png" />
    <meta property="og:image:alt" content="CodeNib's interactive Requests example with indexed calls and source code." />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme.js"></script>
    <script src="/runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
