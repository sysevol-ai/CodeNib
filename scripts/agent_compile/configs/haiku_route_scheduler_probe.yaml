# Focused M3.5+ probe for scheduled static-LSP route lifecycle changes.
#
# Intended command:
#
#   python scripts/agent_compile/aggregate_feedback_probe.py \
#     --preflight-route-lifecycle-config scripts/agent_compile/configs/haiku_route_scheduler_probe.yaml \
#     --route-gate-synthesis-configs Go,Rust \
#     --route-gate-categories traversal \
#     --route-gate-max-queries-per-category 2
#   python scripts/agent_compile/run_synthesis_sweep.py \
#     --config scripts/agent_compile/configs/haiku_route_scheduler_probe.yaml \
#     --output-dir results/agent_compile/haiku_route_scheduler_probe \
#     --synthesis-configs Go,Rust \
#     --categories traversal \
#     --max-queries-per-category 2 \
#     --reps 2
#   python scripts/agent_compile/aggregate_feedback_probe.py \
#     --cells-dir results/agent_compile/haiku_route_scheduler_probe/cells \
#     --output-dir results/agent_compile/haiku_route_scheduler_probe \
#     --require-route-lifecycle-gate
#
# This is the narrow repeat gate for route scheduler edits. It keeps only a
# plain grep baseline and the scheduled route arm so bridge/traceback changes
# can be checked without paying for unrelated fanout or eager-compact arms.

base: design_space.yaml
sweep_id: haiku_route_scheduler_probe
reps: 2
max_turns: 12

instances:
  - caddyserver__caddy-6115
  - astral-sh__ruff-15330

subsets:
  grep_only:
    - read
    - grep
    - glob
    - bash
  preinj_graph_scheduled:
    - read
    - grep
    - glob
    - bash

preload:
  preinj_graph_scheduled:
    retrievers: [embedding]
    top_k: 10
    level: l2
    mode: eager_compact
    compact_keep_reads: 0
    graph_schedule_on_fanout: true
    graph_schedule_on_read_symbols: true
    graph_schedule_audit_answer: true
    graph_read_symbol_min_reads: 2
    graph_generic_read_symbol_min_reads: 4
    graph_read_symbol_max_symbols: 8
    graph_read_symbol_max_nodes: 8
    graph_read_symbol_role_quota: true
    graph_read_symbol_pool_nodes: 20
    graph_read_symbol_neighbor_nodes: 40
    graph_fanout_search_calls: 2
    graph_fanout_read_calls: 6
    graph_fanout_skip_verified_preload: 2
    graph_fanout_turn_ratio: 0.75
    graph_fanout_max_seeds: 5
    graph_fanout_max_nodes: 5
