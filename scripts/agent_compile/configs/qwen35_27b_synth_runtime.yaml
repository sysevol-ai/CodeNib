# Clean agent-runtime matrix on the frozen 500-query synthesis workload.
# Keep every control aligned with qwen_base_compact; only the workload changes.
# Run all five synthesis configs into a fresh output root so exploratory Qwen
# cells with different arm sets are never pooled into this paired comparison.
base: qwen_base_compact.yaml
sweep_id: qwen35_27b_synth_runtime
model: openai/qwen3.5-27b
reps: 1
max_turns: 16
# Qwen's serving window is 65,536 tokens. Keep history below 48k so the
# provider still has room for tool schemas, the 4,096-token completion budget,
# and tokenizer-estimation slack.
max_context_tokens: 48000
max_tokens: 4096
first_turn_tool_choice: null
instances: []
