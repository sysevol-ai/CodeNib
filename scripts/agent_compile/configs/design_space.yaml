# ===========================================================================
# CANONICAL design-space sweep (#133)
# ===========================================================================
# One config, many arms, ALL on the SAME instances / model / reps so every arm
# is directly co-plottable on one Pareto plot (files@k vs tokens). This replaces
# the fragmented cost_* configs whose arms used different instance slices, reps,
# and even datasets/embedding models, and could not be compared head-to-head.
#
# Each arm isolates ONE axis of the pruned skill set so its marginal effect is
# attributable (the old A6-only bundling made rerank / hybrid / graph-nav
# effects unmeasurable):
#
#   defaults_only  — read/grep/glob/bash only, NO retrieval skill (baseline)
#   bm25           — + bm25_search                (lexical)
#   embedding      — + embedding_search           (semantic; prior Pareto winner)
#   bm25_embedding — + both retrievers
#   hybrid         — + hybrid_search fusion       (isolates fusion vs union)
#   rerank         — embedding_search + llm_rerank (isolates reranking)
#   graphnav       — bm25 + find_callers/callees/trace (isolates call-graph nav)
#   lsp_graph      — bm25 + static graph tools shaped like LSP route/definition/refs
#   composer       — codeminer_context one-call composer
#   everything      — the full kept skill set at once (neutral prompt)
#
# "defaults_only" lists the four default TOOL ids: they are tools, not skills,
# so allow_skills={read,grep,glob,bash} matches ZERO skills (the arm exposes
# only the always-on default tools) while staying non-empty (an empty subset
# would trip AgentRunner's empty->full-registry fallback). The default tools are
# emitted from the runner's ToolRegistry regardless of allow_skills.
#
# The codeminer_context composer's call-graph expansion can be toggled OFF for
# an ablation by exporting CODEMINER_COMPOSER_NO_GRAPH=1 before the run (process
# -wide; run the config twice — with and without — to compare graph on/off).
#
# Run:
#   python scripts/agent_compile/run_sweep.py \
#       --config scripts/agent_compile/configs/design_space.yaml \
#       --output-dir results/agent_compile/design_space
#   python scripts/agent_compile/aggregate.py \
#       --cells-dir results/agent_compile/design_space/cells \
#       --output-dir results/agent_compile/design_space

sweep_id: design_space
model: vertex_ai/claude-haiku-4-5
vertex_location: us-east5
vertex_project: null
reps: 3                        # min-of-N cost, mean-of-N accuracy (#131 ritual)
max_turns: 16
temperature: 0.0
max_tokens: 4096
topk: 50
num_retries: 8

dataset: fishmingyu/codeminer-base-dataset
split: test
prebuilt_dir: /mnt/data/codeminer
embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_dimension: 1024
metrics_k: [1, 3, 5, 10]
gt_simplified_symbols: true

include_default_tools: true    # read/grep/glob/bash on for every arm
# system_prompt unset -> the runner's neutral default localization prompt, so
# no arm is steered toward its skills; adoption is the model's choice.

# instances omitted => the WHOLE codeminer-base test split (every instance with
# prebuilt indexes; the runner skips + records any without). All arms run on the
# same full corpus, so every arm stays directly co-plottable on one Pareto plot.
instances: []

subsets:
  defaults_only:
    - read
    - grep
    - glob
    - bash
  bm25:
    - bm25_search
  embedding:
    - embedding_search
  bm25_embedding:
    - bm25_search
    - embedding_search
  hybrid:
    - bm25_search
    - embedding_search
    - hybrid_search
  rerank:
    - embedding_search
    - llm_rerank
  graphnav:
    - bm25_search
    - find_callers
    - find_callees
    - trace
  lsp_graph:
    - bm25_search
    - lsp_route
    - lsp_definition
    - lsp_references
  composer:
    - codeminer_context
  everything:
    - bm25_search
    - embedding_search
    - hybrid_search
    - codeminer_context
    - llm_rerank
    - find_callers
    - find_callees
    - lsp_route
    - lsp_definition
    - lsp_references
    - trace
    - code_to_query
