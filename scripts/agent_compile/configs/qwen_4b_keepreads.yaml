# Historical seed-richness probe on 4B. Runtime semantics make 0 and 1 aliases
# for the mandatory latest read, so only the 2-read arm is a distinct policy;
# do not interpret k0-vs-k1 differences causally.
base: design_space.yaml
sweep_id: qwen_4b_keepreads
vertex_location: null
vertex_project: null
reps: 1
max_turns: 16
first_turn_tool_choice: null
instances: []
subsets:
  grep_only: [read, grep, glob, bash]
  preinj_eager_compact_k0: [read, grep, glob, bash]
  preinj_eager_compact_k1: [read, grep, glob, bash]
  preinj_eager_compact_k2: [read, grep, glob, bash]
preload:
  preinj_eager_compact_k0:
    retrievers: [embedding]
    top_k: 10
    level: l2
    mode: eager_compact
    compact_keep_reads: 0  # compatibility alias for one retained read
  preinj_eager_compact_k1:
    retrievers: [embedding]
    top_k: 10
    level: l2
    mode: eager_compact
    compact_keep_reads: 1  # one retained read; equivalent to k0
  preinj_eager_compact_k2:
    retrievers: [embedding]
    top_k: 10
    level: l2
    mode: eager_compact
    compact_keep_reads: 2
