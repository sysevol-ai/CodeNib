# STRICT LocAgent harness: NO filesystem at all (include_default_tools: false →
# no file_read, no grep). The agent searches (bm25), navigates the call graph,
# and reads code ONLY by symbol via read_code_block (structured node read, the
# LocAgent way). Tests the purest graph-primary regime — is structured search +
# graph navigation + node-read competitive with the grep/read agent on tokens
# and accuracy when there is no file escape hatch at all?
sweep_id: cost_locagent_strict
model: vertex_ai/claude-haiku-4-5
vertex_location: us-east5
vertex_project: null
reps: 3
max_turns: 16
temperature: 0.0
max_tokens: 4096
topk: 50
num_retries: 8
dataset: fishmingyu/codeminer-base-dataset
split: test
prebuilt_dir: /mnt/data/codeminer
embedding_model: Qwen/Qwen3-Embedding-0.6B
embedding_dimension: 1024
metrics_k: [1, 3, 5, 10]
gt_simplified_symbols: true
# No default filesystem tools at all — structured tools must do everything.
include_default_tools: false
system_prompt: |
  You are a code localization agent. Find the code locations (files and symbols)
  relevant to the request, then give a concise answer naming them.

  You have NO filesystem access — no grep, no file_read. You work entirely
  through search, the call graph, and reading code by symbol:
  - bm25_search(query) — find entry-point symbols by name/identifier.
  - find_callers(symbol) / find_callees(symbol) — who calls X / what X calls.
  - trace(from_symbol, to_symbol) — the call path between two symbols.
  - impact_analysis(symbol, direction) — TRANSITIVE callers ("impact") or
    callees ("dependencies"); multi-hop structural reach.
  - read_code_block(symbol) — read a symbol's source by its graph node.

  Workflow — SEARCH -> NAVIGATE -> READ -> ANSWER:
  1. SEARCH — bm25_search for the symbols the request names/implies.
  2. NAVIGATE — follow the call graph (find_callers / find_callees / trace /
     impact_analysis) to reach related code; re-seed with exact symbol names.
  3. READ — read_code_block(symbol) to confirm the code to change is there.
  4. ANSWER — only once you have read the implementing symbol. End with two
     lines, repo-relative:
     Files: path/one.ext, path/two.ext
     Symbols: path/one.ext:symbol_name, ...

  Limited tool budget — converge once a symbol looks right.
instances:
  - redis__redis-10095
  - tokio-rs__tokio-4898
  - facebook__docusaurus-10130
  - axios__axios-4731
  - hashicorp__terraform-34814
  - caddyserver__caddy-5870
  - pydata__xarray-2905
  - sympy__sympy-13031
subsets:
  LOCAGENT_STRICT:
    - bm25_search
    - find_callers
    - find_callees
    - trace
    - impact_analysis
    - read_code_block
