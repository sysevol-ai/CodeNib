<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Agent-ready CodeGraph workflow</title>
  <desc id="description">A clean repository produces BM25 and symbol graph views; verified source windows are then served to Codex or Claude Code over MCP.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dbe5f1" stroke-width="1" opacity=".45"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#canvas)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(50 42)">
      <rect width="38" height="38" rx="11" fill="#2563eb"/>
      <path d="m15 12-5 7 5 7m8-14 5 7-5 7" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="16" fill="#0f172a" font-size="16" font-weight="650">CodeNib</text>
      <text x="52" y="34" fill="#64748b" font-size="12" font-weight="520" letter-spacing="1.2">CODEGRAPH 0.2.1 PREVIEW</text>
    </g>
    <text x="50" y="126" fill="#0f172a" font-size="35" font-weight="650" letter-spacing="-1.2">From checkout to agent context in one command.</text>
    <text x="50" y="158" fill="#475569" font-size="17">Local, model-free repository structure with verified source windows.</text>

    <!-- repository -->
    <g transform="translate(50 207)" filter="url(#shadow)">
      <rect width="224" height="338" rx="18" fill="#fff" stroke="#dbe3ee"/>
      <g transform="translate(22 22)">
        <rect width="42" height="42" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
        <path d="M12 12h8l3 4h9v17H12z" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linejoin="round"/>
        <text x="56" y="18" fill="#64748b" font-size="11" font-weight="650" letter-spacing="1.1">CLEAN GIT</text>
        <text x="56" y="37" fill="#0f172a" font-size="17" font-weight="620">checkout</text>
      </g>
      <line x1="22" y1="82" x2="202" y2="82" stroke="#e2e8f0"/>
      <g transform="translate(22 106)" font-family="Geist Mono, ui-monospace, monospace">
        <g fill="#f8fafc" stroke="#e2e8f0">
          <rect width="180" height="43" rx="9"/>
          <rect y="55" width="180" height="43" rx="9"/>
          <rect y="110" width="180" height="43" rx="9"/>
        </g>
        <g fill="#2563eb">
          <circle cx="17" cy="21.5" r="3.5"/>
          <circle cx="17" cy="76.5" r="3.5"/>
          <circle cx="17" cy="131.5" r="3.5"/>
        </g>
        <g fill="#334155" font-size="12.5">
          <text x="31" y="26">src/router.py</text>
          <text x="31" y="81">pkg/cache.go</text>
          <text x="31" y="136">core/graph.cpp</text>
        </g>
      </g>
      <g transform="translate(22 284)">
        <rect width="180" height="32" rx="16" fill="#f1f5f9"/>
        <circle cx="17" cy="16" r="4" fill="#16a34a"/>
        <text x="31" y="21" fill="#475569" font-size="11.5" font-weight="560">source tree unchanged</text>
      </g>
    </g>

    <!-- flow arrow left -->
    <path d="M285 376h40" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="305" y="360" text-anchor="middle" fill="#64748b" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5">INIT</text>

    <!-- compiler -->
    <g transform="translate(337 188)" filter="url(#shadow)">
      <rect width="466" height="376" rx="20" fill="#fff" stroke="#bfd3f2" stroke-width="1.2"/>
      <rect x="18" y="18" width="430" height="48" rx="12" fill="#0f172a"/>
      <circle cx="39" cy="42" r="4" fill="#60a5fa"/>
      <text x="54" y="47" fill="#e2e8f0" font-family="Geist Mono, ui-monospace, monospace" font-size="14">$ codenib codegraph init .</text>

      <text x="24" y="99" fill="#64748b" font-size="10.5" font-weight="680" letter-spacing="1.3">CONTEXT LAYERS</text>
      <g transform="translate(24 116)">
        <g fill="#f8fafc" stroke="#e2e8f0">
          <rect width="132" height="128" rx="14"/>
          <rect x="143" width="132" height="128" rx="14"/>
          <rect x="286" width="132" height="128" rx="14"/>
        </g>
        <g>
          <rect x="16" y="16" width="34" height="34" rx="10" fill="#dbeafe"/>
          <path d="m26 26 4-4 4 4m-4-4v12m10-7h-5m5 7h-5" fill="none" stroke="#2563eb" stroke-width="1.7" stroke-linecap="round"/>
          <text x="16" y="75" fill="#0f172a" font-size="14" font-weight="650">BM25</text>
          <text x="16" y="96" fill="#64748b" font-size="11.5">ranked exact</text>
          <text x="16" y="112" fill="#64748b" font-size="11.5">identifiers</text>
        </g>
        <g transform="translate(143)">
          <rect x="16" y="16" width="34" height="34" rx="10" fill="#dbeafe"/>
          <circle cx="26" cy="33" r="3" fill="#2563eb"/>
          <circle cx="41" cy="25" r="3" fill="#2563eb"/>
          <circle cx="41" cy="41" r="3" fill="#2563eb"/>
          <path d="m29 31 9-5m-9 9 9 5" stroke="#2563eb" stroke-width="1.6"/>
          <text x="16" y="75" fill="#0f172a" font-size="14" font-weight="650">Symbol graph</text>
          <text x="16" y="96" fill="#64748b" font-size="11.5">references ·</text>
          <text x="16" y="112" fill="#64748b" font-size="11.5">dependencies</text>
        </g>
        <g transform="translate(286)">
          <rect x="16" y="16" width="34" height="34" rx="10" fill="#dbeafe"/>
          <path d="M24 23h19v20H24zM28 28h11m-11 5h8m-8 5h10" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="16" y="75" fill="#0f172a" font-size="14" font-weight="650">Source reads</text>
          <text x="16" y="96" fill="#64748b" font-size="11.5">verified at</text>
          <text x="16" y="112" fill="#64748b" font-size="11.5">runtime</text>
        </g>
      </g>

      <g transform="translate(24 263)">
        <rect width="418" height="88" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
        <path d="M24 25h28v32H24z" fill="#fff" stroke="#60a5fa" stroke-width="1.5"/>
        <path d="M30 33h16m-16 6h16m-16 6h10" stroke="#2563eb" stroke-width="1.4" stroke-linecap="round"/>
        <text x="68" y="35" fill="#1d4ed8" font-size="11" font-weight="680" letter-spacing="1">ONE MANIFEST</text>
        <text x="68" y="56" fill="#0f172a" font-size="14.5" font-weight="600">Source identity checked</text>
        <text x="68" y="74" fill="#64748b" font-size="11.5">before serving</text>
        <rect x="331" y="24" width="67" height="31" rx="15.5" fill="#fff" stroke="#bfdbfe"/>
        <circle cx="349" cy="39.5" r="4" fill="#16a34a"/>
        <text x="360" y="44" fill="#475569" font-size="11" font-weight="600">ready</text>
      </g>
    </g>

    <!-- flow arrow right -->
    <path d="M815 376h40" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="835" y="360" text-anchor="middle" fill="#64748b" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5">MCP</text>

    <!-- agent -->
    <g transform="translate(867 207)" filter="url(#shadow)">
      <rect width="283" height="338" rx="18" fill="#fff" stroke="#dbe3ee"/>
      <g transform="translate(22 22)">
        <rect width="42" height="42" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
        <path d="M13 29V15h16v14M17 15v-4m8 4v-4M17 23h.1M25 23h.1" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="56" y="18" fill="#64748b" font-size="11" font-weight="650" letter-spacing="1.1">CODING AGENT</text>
        <text x="56" y="37" fill="#0f172a" font-size="17" font-weight="620">connected</text>
      </g>
      <g transform="translate(22 83)">
        <rect width="112" height="33" rx="9" fill="#0f172a"/>
        <rect x="120" width="119" height="33" rx="9" fill="#f1f5f9" stroke="#e2e8f0"/>
        <text x="56" y="22" text-anchor="middle" fill="#fff" font-size="12" font-weight="620">Codex</text>
        <text x="179.5" y="22" text-anchor="middle" fill="#334155" font-size="12" font-weight="620">Claude Code</text>
      </g>
      <text x="22" y="147" fill="#64748b" font-size="10.5" font-weight="680" letter-spacing="1.2">BOUNDED TOOLS</text>
      <g transform="translate(22 162)" font-family="Geist Mono, ui-monospace, monospace" font-size="11.5">
        <g fill="#f8fafc" stroke="#e2e8f0">
          <rect width="239" height="38" rx="9"/>
          <rect y="48" width="239" height="38" rx="9"/>
          <rect y="96" width="239" height="38" rx="9"/>
        </g>
        <g fill="#2563eb" font-weight="600">
          <text x="14" y="24">explore_context</text>
          <text x="14" y="72">dependency_subgraph</text>
          <text x="14" y="120">read_source</text>
        </g>
        <g fill="#94a3b8" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">
          <text x="216" y="24">→</text>
          <text x="216" y="72">→</text>
          <text x="216" y="120">→</text>
        </g>
      </g>
      <g transform="translate(22 311)">
        <circle cx="5" cy="0" r="4" fill="#16a34a"/>
        <text x="17" y="4" fill="#475569" font-size="11.5" font-weight="560">bounded · source-linked</text>
      </g>
    </g>
  </g>
</svg>
