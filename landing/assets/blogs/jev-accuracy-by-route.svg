<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img" aria-labelledby="t d">
<title id="t">Recall@5 by retrieval route, before and after reranking</title>
<desc id="d">Code-block Recall@5 on 100 CodeNib Base issues with base-aligned labels. BM25: coverage 63.78%, no reranker 28.78%, Qwen3-Reranker-4B 58.30%, Jev 59.35%; Dense: coverage 71.98%, no reranker 39.75%, Qwen3-Reranker-4B 63.40%, Jev 63.05%; Hybrid: coverage 75.28%, no reranker 32.02%, Qwen3-Reranker-4B 65.03%, Jev 67.92%; Model-planned grep: coverage 75.83%, no reranker 58.62%, Qwen3-Reranker-4B 68.07%, Jev 71.40%.</desc>
