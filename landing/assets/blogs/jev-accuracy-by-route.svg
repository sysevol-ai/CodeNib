.num { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; }
.lab { font-size: 21px; font-weight: 600; }
.sub { font-size: 16px; fill: #64748b; }
.tick { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; fill: #64748b; }
.leg { font-size: 18px; fill: #475569; }
</style>
