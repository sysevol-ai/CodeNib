<svg data-theme="dark" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">CodeGraph architecture: native query paths and semantic contracts</title>
  <desc id="description">Analyzer artifacts pass through provider-specific normalization governed by shared semantic contracts. Capability-scoped native queries, provider-neutral facts, and the complete CodeGraph are distinct representations.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#303338" stroke-width="1" opacity=".42"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#5f93ee" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#8d939b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="630" rx="28" fill="#212327"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>

  <g font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(48 36)">
      <rect width="36" height="36" rx="10" fill="#5f93ee"/>
      <path d="m14 11-5 7 5 7m8-14 5 7-5 7" fill="none" stroke="#1a1b1e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="15" fill="#e8eaed" font-size="15" font-weight="650">CodeNib</text>
      <text x="50" y="32" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="620" letter-spacing="1.15">CODEGRAPH ARCHITECTURE</text>
    </g>

    <text x="48" y="116" fill="#e8eaed" font-size="34" font-weight="660" letter-spacing="-1.15">CodeGraph paths and materialization boundaries.</text>
    <text x="48" y="147" fill="#bdc1c6" font-size="16.5">Provider-specific representations stay behind explicit capability and identity gates.</text>

    <!-- Provider artifacts -->
    <g transform="translate(48 206)">
      <rect width="212" height="276" rx="17" fill="#1a1b1e" stroke="#44484f" stroke-width="1.2"/>
      <text x="20" y="30" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="680" letter-spacing="1.15">PROVIDER ARTIFACTS</text>

      <g transform="translate(18 50)">
        <rect width="176" height="74" rx="12" fill="#212327" stroke="#303338"/>
        <circle cx="21" cy="24" r="5" fill="#5f93ee"/>
        <text x="35" y="28" fill="#e8eaed" font-size="14" font-weight="640">SCIP</text>
        <text x="18" y="53" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="11.5">index.decoded</text>
      </g>

      <g transform="translate(18 136)">
        <rect width="176" height="74" rx="12" fill="#212327" stroke="#303338"/>
        <circle cx="21" cy="24" r="5" fill="#5f93ee"/>
        <text x="35" y="28" fill="#e8eaed" font-size="14" font-weight="640">clangd</text>
        <text x="18" y="53" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="11.5">*.idx shards</text>
      </g>

      <text x="20" y="245" fill="#9aa0a6" font-size="11.5">Existing analyzer output</text>
      <text x="20" y="262" fill="#9aa0a6" font-size="11.5">Analyzer generation excluded</text>
    </g>

    <path d="M271 344h43" fill="none" stroke="#5f93ee" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="292" y="329" text-anchor="middle" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="10">ADAPT</text>

    <!-- Shared semantic contract -->
    <g transform="translate(326 188)">
      <rect width="248" height="314" rx="18" fill="#1a1b1e" stroke="#4a6a9c" stroke-width="1.4"/>
      <rect x="14" y="14" width="220" height="53" rx="11" fill="#0c0d0f"/>
      <text x="29" y="36" fill="#c2c8ce" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="650" letter-spacing=".9">SHARED CONTRACT</text>
      <text x="29" y="55" fill="#fff" font-size="15" font-weight="640">Provider facts</text>

      <g transform="translate(18 87)" font-family="Geist Mono, ui-monospace, monospace" font-size="11.5">
        <g fill="#212327" stroke="#303338">
          <rect width="212" height="37" rx="8"/>
          <rect y="45" width="212" height="37" rx="8"/>
          <rect y="90" width="212" height="37" rx="8"/>
          <rect y="135" width="212" height="37" rx="8"/>
        </g>
        <g fill="#bdc1c6">
          <text x="13" y="23">definitions + references</text>
          <text x="13" y="68">occurrences + ranges</text>
          <text x="13" y="113">adjacency + order</text>
          <text x="13" y="158">roles + diagnostics</text>
        </g>
      </g>

      <g transform="translate(18 270)">
        <rect width="212" height="28" rx="14" fill="#1c2636" stroke="#38557f"/>
        <circle cx="16" cy="14" r="3.5" fill="#2fae5e"/>
        <text x="28" y="18" fill="#aecbfa" font-size="10.5" font-weight="620">paths · ranges · roles</text>
      </g>
    </g>

    <!-- Fan-out -->
    <path d="M585 246h40" fill="none" stroke="#5f93ee" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M585 344h22c10 0 18 8 18 18v25" fill="none" stroke="#5f93ee" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M585 445h22c10 0 18 8 18 18v61" fill="none" stroke="#8d939b" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>

    <!-- FactQueryIndex -->
    <g transform="translate(637 174)">
      <rect width="515" height="150" rx="17" fill="#1a1b1e" stroke="#4a6a9c" stroke-width="1.35"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#263a5c"/>
      <path d="M28 37h16M28 30h10M28 44h12" fill="none" stroke="#5f93ee" stroke-width="1.8" stroke-linecap="round"/>
      <text x="67" y="31" fill="#8ab4f8" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="680" letter-spacing="1">NATIVE QUERY PATH</text>
      <text x="67" y="51" fill="#e8eaed" font-size="17" font-weight="650">FactQueryIndex + adapter</text>
      <text x="18" y="82" fill="#bdc1c6" font-size="12">Integer postings; capabilities are provider-gated</text>

      <g transform="translate(18 99)" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5">
        <rect width="92" height="29" rx="8" fill="#1c2636" stroke="#38557f"/>
        <rect x="100" width="108" height="29" rx="8" fill="#1c2636" stroke="#38557f"/>
        <rect x="216" width="100" height="29" rx="8" fill="#1c2636" stroke="#38557f"/>
        <text x="46" y="19" text-anchor="middle" fill="#8ab4f8">symbols</text>
        <text x="154" y="19" text-anchor="middle" fill="#8ab4f8">opt. positions</text>
        <text x="266" y="19" text-anchor="middle" fill="#8ab4f8">route adapter</text>
        <rect x="324" width="155" height="29" rx="14.5" fill="#16272a" stroke="#1f5e56"/>
        <circle cx="339" cy="14.5" r="3.5" fill="#2fae5e"/>
        <text x="350" y="19" fill="#7fdca0">fmt v3 · 0 graphs</text>
      </g>
    </g>

    <!-- FactBatch -->
    <g transform="translate(637 342)">
      <rect width="515" height="150" rx="17" fill="#1a1b1e" stroke="#3b6f68" stroke-width="1.35"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#16272a"/>
      <path d="M28 28h16v17H28zM31 24h10v4H31m0 7h10m-10 5h7" fill="none" stroke="#1d9c8f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="31" fill="#5fd4c4" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="680" letter-spacing="1">PROVIDER-NEUTRAL MODEL</text>
      <text x="67" y="51" fill="#e8eaed" font-size="17" font-weight="650">FactBatch v1 · one file</text>
      <text x="18" y="82" fill="#bdc1c6" font-size="12">Validated per-file facts with no database lifecycle</text>

      <g transform="translate(18 99)" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5">
        <rect width="104" height="29" rx="8" fill="#16272a" stroke="#1f5e56"/>
        <rect x="112" width="106" height="29" rx="8" fill="#16272a" stroke="#1f5e56"/>
        <rect x="226" width="82" height="29" rx="8" fill="#16272a" stroke="#1f5e56"/>
        <text x="52" y="19" text-anchor="middle" fill="#5fd4c4">source digest</text>
        <text x="165" y="19" text-anchor="middle" fill="#5fd4c4">profile digest</text>
        <text x="267" y="19" text-anchor="middle" fill="#5fd4c4">provenance</text>
        <rect x="316" width="163" height="29" rx="14.5" fill="#16272a" stroke="#1f5e56"/>
        <circle cx="331" cy="14.5" r="3.5" fill="#2fae5e"/>
        <text x="342" y="19" fill="#7fdca0" font-size="10">native buffer · no DB</text>
      </g>
    </g>

    <!-- Complete graph fallback -->
    <g transform="translate(637 510)">
      <rect width="515" height="62" rx="14" fill="#1a1b1e" stroke="#44484f" stroke-width="1.2"/>
      <text x="18" y="25" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5" font-weight="680" letter-spacing=".9">COMPATIBILITY AUTHORITY</text>
      <text x="18" y="45" fill="#e8eaed" font-size="14" font-weight="640">Complete CodeGraph / igraph</text>
      <text x="496" y="45" text-anchor="end" fill="#9aa0a6" font-size="11.5">direct selection · request fallback</text>
    </g>

    <text x="48" y="604" fill="#9aa0a6" font-family="Geist Mono, ui-monospace, monospace" font-size="10.5">EXISTING ARTIFACTS · PROVIDER-SPECIFIC RECEIPTS · IDENTITY FAILURES FAIL CLOSED · EXTERNAL ANALYZER GENERATION EXCLUDED</text>
  </g>
</svg>
