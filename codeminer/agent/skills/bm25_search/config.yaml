skill_id: bm25_search
skill_type: retrieval
operator: bm25.topk
cost: low

defaults:
  top_k: 20
  filter_test: false
  return_content: true
  wrap_with_line_numbers: true

inputs:
  - name: query
    type: str
    required: true
    description: Search query
  - name: top_k
    type: int
    required: false
    default: 20
  - name: filter_test
    type: bool
    required: false
    default: false

outputs:
  type: List[QueriedNode]

index_requirements:
  - type: bm25
    max_age_seconds: 3600
    scope: current_repo

resources: []
