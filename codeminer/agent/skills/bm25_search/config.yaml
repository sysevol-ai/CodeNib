# ``custom`` (not ``retrieval``) because the optional names-mode relabel needs
# BOTH the retrieve context's BM25 index AND the expand context's symbol graph
# (to resolve raw content-hash identity names to readable ``unified_name``s).
# It therefore receives a typed ``ComposerContexts`` bundle, like
# ``codeminer_context``. With no graph available it degrades to raw names.
skill_id: bm25_search
skill_type: custom
operator: bm25.topk
cost: low

defaults:
  top_k: 20
  filter_test: false
  return_content: true
  wrap_with_line_numbers: true

inputs:
  - name: query
    type: str
    required: true
    description: Keywords / identifiers to search for.
  - name: top_k
    type: int
    required: false
    default: 20
    description: Number of ranked symbol chunks to return.
  - name: names_only
    type: bool
    required: false
    default: false
    description: >-
      Return symbol NAME tags only (name + file:line + kind, NO code bodies) —
      the compact LocAgent-style entry point: get candidate symbol names, then
      navigate the call graph and read the ones you want. Default (false)
      returns code bodies.
  - name: filter_test
    type: bool
    required: false
    default: false
    description: Drop matches that live in test files.

outputs:
  type: List[QueriedNode]
  description: >-
    Ranked code nodes. Names are relabeled to readable ``unified_name`` when a
    symbol graph is available; code bodies are omitted when names_only=true.

index_requirements:
  - type: bm25
    max_age_seconds: 3600
    scope: current_repo
  # Optional: only used to relabel raw identity names to readable form. Absent
  # graph -> raw names, no hard failure (so a bm25-only subset stays cheap).
  - type: symbol_graph
    max_age_seconds: 3600
    scope: current_repo
    required: false

resources: []
