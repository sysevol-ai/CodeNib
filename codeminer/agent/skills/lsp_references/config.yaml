skill_id: lsp_references
skill_type: expand
operator: graph.lsp.references
cost: low
defaults:
  top_k: 40
  include_declaration: true
inputs:
  - name: file_path
    type: str
    required: false
    description: Repo-relative file path from a read/grep result. Provide with line when finding references from a location.
  - name: line
    type: int
    required: false
    is_line_number: true
    description: 1-based source line as shown by read/grep output. Internally converted to the graph's 0-based line.
  - name: character
    type: int
    required: false
    description: Optional 0-based column. Provide it when the source line contains multiple identifiers or overloads.
  - name: symbol
    type: str
    required: false
    description: Optional exact or fuzzy symbol/display name. Use instead of file_path+line when you already know the symbol.
  - name: include_declaration
    type: bool
    required: false
    description: Include the definition span alongside reference sites.
  - name: top_k
    type: int
    required: false
    description: Maximum number of reference locations to return.
outputs:
  type: List[QueriedNode]
  description: Compact definition/reference locations from the selected LSP provider. No source bodies; read returned files before answering.
index_requirements:
  - type: symbol_graph
    max_age_seconds: 3600
    scope: current_repo
resources: []
