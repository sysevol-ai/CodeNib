skill_id: find_related_code
skill_type: expand
operator: graph.walk
cost: low

defaults:
  relation: both
  hops: 1

inputs:
  - name: symbol
    type: str
    required: true
    description: >-
      A function or class name to navigate from (e.g. "doWatch" or a qualified
      "module.Class.method"). Fuzzy-matched; if ambiguous the tool returns
      candidate names to retry with.
  - name: relation
    type: str
    required: false
    default: both
    description: '"callers" (who calls it), "callees" (what it calls), or "both".'
  - name: hops
    type: int
    required: false
    default: 1
    description: How many hops to follow (1 or 2). Keep at 1 unless you need a wider neighbourhood.

outputs:
  type: List[QueriedNode]
  description: >-
    Compact relationship map — related symbols with name, file:line, kind, and
    the relation ("caller of X" / "callee of X"). No code bodies; use file_read
    to fetch source for the ones you care about.

index_requirements:
  - type: symbol_graph
    max_age_seconds: 3600
    scope: current_repo

resources: []
