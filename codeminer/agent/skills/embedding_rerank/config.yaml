skill_id: embedding_rerank
skill_type: rerank
operator: embedding.rerank
cost: medium

defaults:
  top_k: 5
  candidate_top_k: 50

inputs:
  - name: query
    type: str
    required: true
    description: Search query to compute similarity against
  - name: candidates
    type: List[QueriedNode]
    required: true
    description: Candidate nodes to rerank by embedding similarity
  - name: top_k
    type: int
    required: false
    default: 5

outputs:
  type: List[QueriedNode]

index_requirements:
  - type: vector
    required: false

resources: []
