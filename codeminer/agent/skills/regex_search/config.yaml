skill_id: regex_search
skill_type: retrieval
operator: regex.retrieve
cost: low

defaults:
  top_k: 20
  case_sensitive: false
  use_regex: true

inputs:
  - name: pattern
    type: str
    required: true
    description: Regex pattern or literal string to search for
  - name: top_k
    type: int
    required: false
    default: 20
  - name: file_glob
    type: str
    required: false
    default: null
    description: "Glob pattern to restrict search to matching files (e.g. '*.py')"
  - name: node_type
    type: str
    required: false
    default: null
    description: "Filter results to a specific node type (e.g. 'function', 'class')"
  - name: case_sensitive
    type: bool
    required: false
    default: false
  - name: use_regex
    type: bool
    required: false
    default: true

outputs:
  type: List[QueriedNode]

index_requirements: []

resources: []
