name: "Setup CodeNib Environment"
description: "Shared environment setup for CI jobs (conda, scip, toolchains)"

inputs:
  python-version:
    description: "Python version for conda"
    required: false
    default: "3.12"
  project-extras:
    description: "Comma-separated CodeNib extras installed with the editable package"
    required: false
    default: "test"
  install-rust:
    description: "Install Rust toolchain + rust-analyzer"
    required: false
    default: "true"
  rust-toolchain:
    description: "Rust toolchain used by rust-analyzer SCIP/LSP tests"
    required: false
    default: "nightly-2026-02-22"
  install-clangd:
    description: "Install clangd"
    required: false
    default: "false"
  install-scip-typescript:
    description: "Install scip-typescript, yarn, and pnpm through Makefile"
    required: false
    default: "true"
  install-scip-go:
    description: "Install scip-go (scip-code/scip-go, the SCIP Go indexer)"
    required: false
    default: "true"
  install-bear:
    description: "Install bear build tool"
    required: false
    default: "false"
  preinstall-cpu-torch:
    description: "Install a CPU-only torch wheel before project dependencies"
    required: false
    default: "true"
  torch-version:
    description: "CPU torch wheel version to preinstall"
    required: false
    default: "2.12.1+cpu"
  torch-index-url:
    description: "Package index that serves CPU-only torch wheels"
    required: false
    default: "https://download.pytorch.org/whl/cpu"

runs:
  using: "composite"
  steps:
    - name: Set up codenib conda env
      uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3.3.0
      with:
        activate-environment: codenib-test
        python-version: ${{ inputs.python-version }}
        auto-activate-base: false
        remove-profiles: true

    - name: Create scip env
      shell: bash -l {0}
      run: |
        if ! conda env list | grep -q 'scip-env'; then
          conda env create --quiet --solver=libmamba --file codenib/scip_interface/scip-environment.yml
        fi

    - name: Build and install scip-python
      shell: bash -l {0}
      run: |
        set -euo pipefail
        git submodule update --init --recursive third_party/scip-python
        SCIP_PYTHON_SHA="$(git -C third_party/scip-python rev-parse HEAD)"
        TOOLCHAIN_CACHE="${{ github.workspace }}/../.cache/codenib-toolchains"
        # scip-env is recreated per job, and a host-wide scip-python on PATH
        # used to satisfy a cache probe against it, so jobs silently ran that
        # binary instead of this submodule. Keep one install per revision.
        # The runner normalizes GITHUB_PATH entries, so drop the `..` here too
        # for the resolution check below to compare equal paths.
        SCIP_PYTHON_PREFIX="$(realpath -m "$TOOLCHAIN_CACHE")/scip-python/$SCIP_PYTHON_SHA"
        SCIP_PYTHON_BIN="$SCIP_PYTHON_PREFIX/bin/scip-python"
        if [ -x "$SCIP_PYTHON_BIN" ]; then
          echo "[scip-python] cached revision $SCIP_PYTHON_SHA"
        else
          STAGE="$SCIP_PYTHON_PREFIX.tmp.$$"
          trap 'rm -rf "$STAGE"' EXIT
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          # prepack builds dist/ and copies README/LICENSE into the submodule
          # before the tarball is written; clean removes them afterwards.
          conda run -n scip-env bash -lc "
            set -euo pipefail
            cd third_party/scip-python
            npm ci
            cd packages/pyright-scip
            npm ci
            npm pack --pack-destination '$STAGE'
            npm install -g --prefix '$STAGE' '$STAGE'/sourcegraph-scip-python-*.tgz
            npm run clean
          "
          rm -rf "$SCIP_PYTHON_PREFIX"
          mv "$STAGE" "$SCIP_PYTHON_PREFIX"
        fi
        echo "$SCIP_PYTHON_PREFIX/bin" >> "$GITHUB_PATH"
        echo "CODENIB_CI_SCIP_PYTHON=$SCIP_PYTHON_BIN" >> "$GITHUB_ENV"
        "$SCIP_PYTHON_BIN" --version

    - name: Install dependencies
      shell: bash -l {0}
      env:
        CODENIB_CI_PREINSTALL_CPU_TORCH: ${{ inputs.preinstall-cpu-torch }}
        CODENIB_CI_PROJECT_EXTRAS: ${{ inputs.project-extras }}
        CODENIB_CI_TORCH_VERSION: ${{ inputs.torch-version }}
        CODENIB_CI_TORCH_INDEX_URL: ${{ inputs.torch-index-url }}
      run: |
        python -m pip install --upgrade pip
        if [[ ! "$CODENIB_CI_PROJECT_EXTRAS" =~ ^[A-Za-z0-9_-]+(,[A-Za-z0-9_-]+)*$ ]]; then
          echo "::error::Invalid project-extras value: $CODENIB_CI_PROJECT_EXTRAS"
          exit 2
        fi
        if [[ "$CODENIB_CI_PREINSTALL_CPU_TORCH" == "true" ]]; then
          python -m pip install \
            --index-url "$CODENIB_CI_TORCH_INDEX_URL" \
            "torch==$CODENIB_CI_TORCH_VERSION"
        fi
        pip install -e ".[${CODENIB_CI_PROJECT_EXTRAS}]"

    - name: Install Python identity-recovery provider
      shell: bash -l {0}
      run: |
        # SCIP identity normalization uses positional LSP evidence for collisions.
        make python-lsp-tool
        eval "$(make --no-print-directory active-scip-env | sed -n 's/^  export /export /p')"
        echo "$CODENIB_SCIP_TOOLS_DIR/node-tools/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$CODENIB_SCIP_TOOLS_DIR" >> "$GITHUB_PATH"
        basedpyright --version
        command -v basedpyright-langserver

    - name: Install Rust toolchain + rust-analyzer
      if: inputs.install-rust == 'true'
      shell: bash -l {0}
      run: |
        RUST_TOOLCHAIN="${{ inputs.rust-toolchain }}"
        TOOLCHAIN_CACHE="${{ github.workspace }}/../.cache/codenib-toolchains"
        export CARGO_HOME="$TOOLCHAIN_CACHE/cargo"
        export RUSTUP_HOME="$TOOLCHAIN_CACHE/rustup"
        mkdir -p "$CARGO_HOME" "$RUSTUP_HOME"
        echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUSTUP_HOME" >> "$GITHUB_ENV"
        echo "CODENIB_RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
        echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
        RUSTUP="$CARGO_HOME/bin/rustup"
        if [ ! -x "$RUSTUP" ]; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path
        fi
        if ! "$RUSTUP" toolchain list \
          | awk '{print $1}' \
          | grep -Eq '^stable(-|$)'; then
          "$RUSTUP" toolchain install --profile minimal stable
        fi
        if ! "$RUSTUP" toolchain list \
          | awk '{print $1}' \
          | grep -Eq "^${RUST_TOOLCHAIN}(-|$)"; then
          "$RUSTUP" toolchain install --profile minimal "$RUST_TOOLCHAIN"
        fi
        if ! "$RUSTUP" component list \
          --installed --toolchain "$RUST_TOOLCHAIN" \
          | grep -q '^rust-analyzer-'; then
          "$RUSTUP" component add rust-analyzer --toolchain "$RUST_TOOLCHAIN"
        fi
        CODENIB_RUST_TOOLCHAIN="$RUST_TOOLCHAIN" \
          "$RUSTUP" run "$RUST_TOOLCHAIN" rust-analyzer --version

    - name: Install clangd
      if: inputs.install-clangd == 'true'
      shell: bash -l {0}
      run: |
        if ! command -v clangd >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y clangd
            elif [ "$(id -u)" = "0" ]; then
              apt-get update && apt-get install -y clangd
            else
              echo "WARN: cannot install clangd without sudo/root"
            fi
          else
            echo "WARN: apt-get not available; skipping clangd install"
          fi
        fi
        clangd --version || true

    - name: Install scip-typescript
      if: inputs.install-scip-typescript == 'true'
      shell: bash -l {0}
      run: |
        make scip-typescript-tool node-workspace-tools
        eval "$(make --no-print-directory active-scip-env | sed -n 's/^  export /export /p')"
        echo "$CODENIB_SCIP_TOOLS_DIR/node-tools/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$CODENIB_SCIP_TOOLS_DIR" >> "$GITHUB_PATH"
        scip-typescript --version
        yarn --version
        pnpm --version

    - name: Install scip-go
      if: inputs.install-scip-go == 'true'
      shell: bash -l {0}
      run: |
        if command -v scip-go >/dev/null 2>&1; then
          scip-go --version || true
          echo "[scip-go] already on PATH — skipping install"
          exit 0
        fi
        make scip-go-tool
        eval "$(make --no-print-directory active-scip-env | sed -n 's/^  export /export /p')"
        echo "$CODENIB_SCIP_TOOLS_DIR/go-tools/bin" >> "$GITHUB_PATH"
        echo "$CODENIB_SCIP_TOOLS_DIR/go/bin" >> "$GITHUB_PATH"
        echo "$CODENIB_SCIP_TOOLS_DIR" >> "$GITHUB_PATH"
        scip-go --version || true

    - name: Install bear (best effort)
      if: inputs.install-bear == 'true'
      shell: bash -l {0}
      run: |
        if command -v bear >/dev/null 2>&1; then
          bear --version || true
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bear
          elif [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y bear
          else
            echo "WARN: apt-get available but no sudo/root; cannot install bear"
          fi
        else
          echo "WARN: apt-get not available; skipping bear install"
        fi

    - name: Verify pinned scip-python resolution
      shell: bash -l {0}
      run: |
        # Later steps prepend tool directories; none may shadow the pinned build.
        actual="$(command -v scip-python || true)"
        if [ "$actual" != "$CODENIB_CI_SCIP_PYTHON" ]; then
          echo "::error::scip-python resolves to '${actual:-nothing}', not the pinned submodule build at $CODENIB_CI_SCIP_PYTHON"
          exit 1
        fi
        scip-python --version
