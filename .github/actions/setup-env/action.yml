name: "Setup CodeNib Environment"
description: "Shared environment setup for CI jobs (conda, scip, toolchains)"

inputs:
  python-version:
    description: "Python version for conda"
    required: false
    default: "3.12"
  install-rust:
    description: "Install Rust toolchain + rust-analyzer"
    required: false
    default: "true"
  rust-toolchain:
    description: "Rust toolchain used by rust-analyzer SCIP/LSP tests"
    required: false
    default: "nightly-2026-02-22"
  install-clangd:
    description: "Install clangd"
    required: false
    default: "false"
  install-scip-typescript:
    description: "Install scip-typescript, yarn, and pnpm through Makefile"
    required: false
    default: "true"
  install-scip-go:
    description: "Install scip-go (scip-code/scip-go, the SCIP Go indexer)"
    required: false
    default: "true"
  install-bear:
    description: "Install bear build tool"
    required: false
    default: "false"
  preinstall-cpu-torch:
    description: "Install a CPU-only torch wheel before project dependencies"
    required: false
    default: "true"
  torch-version:
    description: "CPU torch wheel version to preinstall"
    required: false
    default: "2.12.1+cpu"
  torch-index-url:
    description: "Package index that serves CPU-only torch wheels"
    required: false
    default: "https://download.pytorch.org/whl/cpu"

runs:
  using: "composite"
  steps:
    - name: Set up codeminer conda env
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: codeminer-test
        python-version: ${{ inputs.python-version }}
        auto-activate-base: false
        remove-profiles: true

    - name: Create scip env
      shell: bash -l {0}
      run: |
        if ! conda env list | grep -q 'scip-env'; then
          conda env create --quiet --solver=libmamba --file codeminer/scip_interface/scip-environment.yml
        fi

    - name: Build and install scip-python
      shell: bash -l {0}
      run: |
        git submodule update --init --recursive third_party/scip-python
        conda run -n scip-env bash -lc "
          set -euo pipefail
          cd third_party/scip-python
          npm ci
          cd packages/pyright-scip
          npm ci
          npm run build
          npm install -g .
        "

    - name: Install dependencies
      shell: bash -l {0}
      env:
        CODEMINER_CI_PREINSTALL_CPU_TORCH: ${{ inputs.preinstall-cpu-torch }}
        CODEMINER_CI_TORCH_VERSION: ${{ inputs.torch-version }}
        CODEMINER_CI_TORCH_INDEX_URL: ${{ inputs.torch-index-url }}
      run: |
        python -m pip install --upgrade pip
        if [[ "$CODEMINER_CI_PREINSTALL_CPU_TORCH" == "true" ]]; then
          python -m pip install \
            --index-url "$CODEMINER_CI_TORCH_INDEX_URL" \
            "torch==$CODEMINER_CI_TORCH_VERSION"
        fi
        pip install -e ".[test]"

    - name: Install Rust toolchain + rust-analyzer
      if: inputs.install-rust == 'true'
      shell: bash -l {0}
      run: |
        RUST_TOOLCHAIN="${{ inputs.rust-toolchain }}"
        echo "CODEMINER_RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        fi
        if [ -f "$HOME/.cargo/env" ]; then
          . "$HOME/.cargo/env"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install --profile minimal stable "$RUST_TOOLCHAIN"
        rustup component add rust-analyzer --toolchain "$RUST_TOOLCHAIN"
        CODEMINER_RUST_TOOLCHAIN="$RUST_TOOLCHAIN" rustup run "$RUST_TOOLCHAIN" rust-analyzer --version

    - name: Install clangd
      if: inputs.install-clangd == 'true'
      shell: bash -l {0}
      run: |
        if ! command -v clangd >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y clangd
            elif [ "$(id -u)" = "0" ]; then
              apt-get update && apt-get install -y clangd
            else
              echo "WARN: cannot install clangd without sudo/root"
            fi
          else
            echo "WARN: apt-get not available; skipping clangd install"
          fi
        fi
        clangd --version || true

    - name: Install scip-typescript
      if: inputs.install-scip-typescript == 'true'
      shell: bash -l {0}
      run: |
        make scip-typescript-tool node-workspace-tools
        eval "$(make --no-print-directory active-scip-env | sed -n 's/^  export /export /p')"
        echo "$CODEMINER_SCIP_TOOLS_DIR/node-tools/node_modules/.bin" >> "$GITHUB_PATH"
        echo "$CODEMINER_SCIP_TOOLS_DIR" >> "$GITHUB_PATH"
        scip-typescript --version
        yarn --version
        pnpm --version

    - name: Install scip-go
      if: inputs.install-scip-go == 'true'
      shell: bash -l {0}
      run: |
        if command -v scip-go >/dev/null 2>&1; then
          scip-go --version || true
          echo "[scip-go] already on PATH — skipping install"
          exit 0
        fi
        make scip-go-tool
        eval "$(make --no-print-directory active-scip-env | sed -n 's/^  export /export /p')"
        echo "$CODEMINER_SCIP_TOOLS_DIR/go-tools/bin" >> "$GITHUB_PATH"
        echo "$CODEMINER_SCIP_TOOLS_DIR/go/bin" >> "$GITHUB_PATH"
        echo "$CODEMINER_SCIP_TOOLS_DIR" >> "$GITHUB_PATH"
        scip-go --version || true

    - name: Install bear (best effort)
      if: inputs.install-bear == 'true'
      shell: bash -l {0}
      run: |
        if command -v bear >/dev/null 2>&1; then
          bear --version || true
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bear
          elif [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y bear
          else
            echo "WARN: apt-get available but no sudo/root; cannot install bear"
          fi
        else
          echo "WARN: apt-get not available; skipping bear install"
        fi
