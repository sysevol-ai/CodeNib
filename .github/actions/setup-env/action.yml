name: "Setup CodeMiner Environment"
description: "Shared environment setup for CI jobs (conda, scip, toolchains)"

inputs:
  python-version:
    description: "Python version for conda"
    required: false
    default: "3.12"
  install-rust:
    description: "Install Rust toolchain + rust-analyzer"
    required: false
    default: "true"
  install-clangd:
    description: "Install clangd"
    required: false
    default: "false"
  install-scip-typescript:
    description: "Install scip-typescript and yarn"
    required: false
    default: "true"
  install-scip-go:
    description: "Install scip-go (scip-code/scip-go, the SCIP Go indexer)"
    required: false
    default: "true"
  install-bear:
    description: "Install bear build tool"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up codeminer conda env
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: codeminer-test
        python-version: ${{ inputs.python-version }}
        auto-activate-base: false
        remove-profiles: false

    - name: Create scip env
      shell: bash -l {0}
      run: |
        if ! conda env list | grep -q 'scip-env'; then
          conda env create --quiet --solver=libmamba --file codeminer/scip_interface/scip-environment.yml
        fi

    - name: Build and install scip-python
      shell: bash -l {0}
      run: |
        git submodule update --init --recursive third_party/scip-python
        conda run -n scip-env bash -lc "
          set -euo pipefail
          cd third_party/scip-python
          npm ci
          cd packages/pyright-scip
          npm ci
          npm run build
          npm install -g .
        "

    - name: Install dependencies
      shell: bash -l {0}
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Install Rust toolchain + rust-analyzer
      if: inputs.install-rust == 'true'
      shell: bash -l {0}
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        fi
        if [ -f "$HOME/.cargo/env" ]; then
          . "$HOME/.cargo/env"
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        rustup toolchain install stable nightly
        rustup component add rust-analyzer --toolchain nightly

    - name: Install clangd
      if: inputs.install-clangd == 'true'
      shell: bash -l {0}
      run: |
        if ! command -v clangd >/dev/null 2>&1; then
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y clangd
            elif [ "$(id -u)" = "0" ]; then
              apt-get update && apt-get install -y clangd
            else
              echo "WARN: cannot install clangd without sudo/root"
            fi
          else
            echo "WARN: apt-get not available; skipping clangd install"
          fi
        fi
        clangd --version || true

    - name: Install scip-typescript
      if: inputs.install-scip-typescript == 'true'
      shell: bash -l {0}
      run: |
        npm config set prefix "$HOME/.npm-global"
        export PATH="$HOME/.npm-global/bin:$PATH"
        npm install -g @sourcegraph/scip-typescript yarn
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

    - name: Install scip-go
      if: inputs.install-scip-go == 'true'
      shell: bash -l {0}
      # Installs scip-go via `go install`, which needs a Go toolchain.
      # We pin it inside scip-env (conda-forge) so the host doesn't need
      # apt/sudo. Upstream: github.com/scip-code/scip-go (moved from
      # sourcegraph/scip-go in 2024). scip-go ends up in $HOME/go/bin
      # (the default GOBIN) and we export that onto $GITHUB_PATH.
      run: |
        if command -v scip-go >/dev/null 2>&1; then
          scip-go --version || true
          echo "[scip-go] already on PATH — skipping install"
          exit 0
        fi
        if ! conda run -n scip-env bash -lc "command -v go" >/dev/null 2>&1; then
          conda install -n scip-env -c conda-forge -y 'go>=1.22'
        fi
        export GOBIN="$HOME/go/bin"
        mkdir -p "$GOBIN"
        conda run -n scip-env bash -lc "
          set -euo pipefail
          export GOBIN='$GOBIN'
          go install github.com/scip-code/scip-go/cmd/scip-go@latest
        "
        echo "$GOBIN" >> "$GITHUB_PATH"
        "$GOBIN/scip-go" --version || true

    - name: Install bear (best effort)
      if: inputs.install-bear == 'true'
      shell: bash -l {0}
      run: |
        if command -v bear >/dev/null 2>&1; then
          bear --version || true
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y bear
          elif [ "$(id -u)" = "0" ]; then
            apt-get update
            apt-get install -y bear
          else
            echo "WARN: apt-get available but no sudo/root; cannot install bear"
          fi
        else
          echo "WARN: apt-get not available; skipping bear install"
        fi
