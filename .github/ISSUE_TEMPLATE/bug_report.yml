name: Bug Report
description: Report a bug or unexpected behavior
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `pytest test/...`
        2. Observe error ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: Paste the full error traceback or log output.
      render: shell

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of CodeMiner is affected?
      options:
        - agent
        - chunking
        - graph
        - index
        - dataset
        - scip
        - llm
        - ops
        - compiler
        - eval
        - ci
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, GPU, relevant package versions.
      placeholder: "Python 3.12, Ubuntu 22.04, CUDA 12.x"
