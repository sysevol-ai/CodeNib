name: Bug Report
description: Report a bug or unexpected behavior
labels: ["type/bug", "status/triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `pytest test/...`
        2. Observe error ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: Paste the full error traceback or log output.
      render: shell

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of CodeMiner is affected? (Triage will apply the matching `scope/` label.)
      options:
        - scope/agent
        - scope/chunking
        - scope/graph
        - scope/indexing
        - scope/retrieval
        - scope/compiler
        - scope/eval
        - scope/llm
        - scope/infra
        - other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, GPU, relevant package versions.
      placeholder: "Python 3.12, Ubuntu 22.04, CUDA 12.x"
