name: Feature Request
description: Propose a new feature or enhancement
labels: ["type/feature", "status/triage"]
body:
  - type: markdown
    attributes:
      value: Describe the feature you'd like to see in CodeNib.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Why is it needed?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this feature work? Include API sketches, CLI examples, or diagrams if helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area of CodeNib does this relate to? (Triage will apply the matching `scope/` label.)
      options:
        - scope/agent
        - scope/chunking
        - scope/graph
        - scope/indexing
        - scope/retrieval
        - scope/compiler
        - scope/eval
        - scope/llm
        - scope/infra
        - other
    validations:
      required: true
