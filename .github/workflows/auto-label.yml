name: Label PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: self-hosted
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
