name: Label PRs

on:
  # This metadata-only workflow needs write access for fork pull requests. It
  # deliberately does not check out or execute pull-request content.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
