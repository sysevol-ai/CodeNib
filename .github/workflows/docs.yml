name: Docs

on:
  push:
    branches:
      - main
      - master
    paths:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "Makefile"
      - "codenib/**/*.py"
      - "core/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/check_public_docs.py"
      - "scripts/language_capability_matrix.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "Makefile"
      - "codenib/**/*.py"
      - "core/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "scripts/check_public_docs.py"
      - "scripts/language_capability_matrix.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Check display branding
        run: python scripts/check_namespace.py

      - name: Install docs dependencies
        # Keep in sync with the `dev` extra in pyproject.toml. The codenib
        # package itself is deliberately NOT installed: griffe reads the source
        # statically, so the API reference builds without igraph, faiss,
        # litellm, or any other optional runtime. `black` is not a linter here —
        # mkdocstrings uses it to format the rendered signatures, and without it
        # they silently collapse onto one line.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs<2.0.0" \
            "mkdocs-material>=9.5.0" \
            "mkdocstrings-python>=2.0.0" \
            "mkdocs-api-autonav>=0.4.0" \
            "black>=22.3.0"

      - name: Check generated capability docs
        run: >-
          python scripts/language_capability_matrix.py
          --check docs/language_capabilities.md

      - name: Build docs
        run: python -m mkdocs build --strict

      - name: Check public docs boundary
        run: python scripts/check_public_docs.py

      - name: Configure GitHub Pages
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.private == false
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.private == false
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
