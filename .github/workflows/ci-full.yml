name: Full CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  schedule:
    # 07:00 UTC daily — forces a full serial-chain run so the graph.pkl cache
    # and C++ parity never silently rot on light-only weeks.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests/bench run"
        required: false
        default: false
        type: boolean
      test_tier:
        description: "Test tier to run"
        required: false
        default: "full"
        type: choice
        options:
          - light
          - full
      cold_parser_cache:
        description: "Start parser prewarm from an empty run-scoped cache"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CODENIB_CI_TORCH_VERSION: "2.12.1+cpu"
  CODENIB_CI_TORCH_INDEX_URL: "https://download.pytorch.org/whl/cpu"

concurrency:
  # Trusted full runs must complete so caches and downstream consumers observe
  # one coherent producer chain.
  group: full-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # =============================================================
  # Preflight — evaluate skip condition once for all jobs
  # =============================================================
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
      run-serial: ${{ steps.serial.outputs.run-serial }}
      serial-reason: ${{ steps.serial.outputs.serial-reason }}
      run-slow: ${{ steps.slow.outputs.run-slow }}
      slow-reason: ${{ steps.slow.outputs.slow-reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate skip condition
        id: check
        run: |
          SKIP=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.skip_tests }}" == "true" ]]; then
              SKIP=true
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ "${{ contains(github.event.head_commit.message, '[skip tests]') }}" == "true" ]]; then
              SKIP=true
            fi
          fi
          if [[ "$SKIP" == "true" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up classifier Python
        if: github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Classify serial-chain source changes
        id: filter
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/classify_ci_changes.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --github-output >> "$GITHUB_OUTPUT"

      - name: Compute run-serial
        id: serial
        run: |
          RUN_SERIAL=true
          REASON="event was not classified; running conservatively"
          case "${{ github.event_name }}" in
            schedule)
              RUN_SERIAL=true
              REASON="scheduled full run" ;;
            workflow_dispatch)
              if [[ "${{ github.event.inputs.test_tier }}" == "full" ]]; then
                RUN_SERIAL=true
                REASON="manual full tier"
              else
                RUN_SERIAL=false
                REASON="manual light tier"
              fi ;;
            push)
              RUN_SERIAL="${{ steps.filter.outputs.run-serial }}"
              REASON="${{ steps.filter.outputs.serial-reason }}" ;;
          esac
          echo "run-serial=$RUN_SERIAL" >> "$GITHUB_OUTPUT"
          echo "serial-reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "run-serial=$RUN_SERIAL ($REASON)"

      - name: Compute run-slow
        id: slow
        run: |
          RUN_SLOW=false
          REASON="not requested"
          case "${{ github.event_name }}" in
            schedule)
              RUN_SLOW=true
              REASON="scheduled full run" ;;
            workflow_dispatch)
              if [[ "${{ github.event.inputs.test_tier }}" == "full" ]]; then
                RUN_SLOW=true
                REASON="manual full tier"
              else
                REASON="manual light tier"
              fi ;;
          esac
          echo "run-slow=$RUN_SLOW" >> "$GITHUB_OUTPUT"
          echo "slow-reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "run-slow=$RUN_SLOW ($REASON)"

  # =============================================================
  # Job 1 — Unit tests  (pure logic, mocks only, ~1 min)
  # =============================================================
  unit:
    needs: preflight
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up codenib conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: codenib-test
          python-version: "3.12"
          auto-activate-base: false
          remove-profiles: true

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url "$CODENIB_CI_TORCH_INDEX_URL" \
            "torch==$CODENIB_CI_TORCH_VERSION"
          pip install -e ".[test]"

      - name: Prewarm tree-sitter parsers
        id: parsers
        uses: ./.github/actions/prewarm-parsers
        with:
          cold-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cold_parser_cache) }}

      - name: Run unit tests
        id: unit-tests
        shell: bash -l {0}
        run: pytest -n auto -m "not slow and not integration and not integration_serial and not integration_serial_consumer" -x --tb=short --timeout=180 --durations=20

      - name: Remove incomplete run-scoped parser cache
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cold_parser_cache)) && (steps.parsers.outcome != 'success' || steps.unit-tests.outcome != 'success')
        env:
          COLD_RUN_DIR: ${{ github.workspace }}/../.cache/tree-sitter-language-pack/cold/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -n "$COLD_RUN_DIR" ]]; then
            rm -rf -- "$COLD_RUN_DIR"
          fi

  # =============================================================
  # Job 2 — Integration tests  (read-only, parallel-safe, ~2 min)
  #   Chunkers, fixture-based SCIP — uses xdist for parallelism
  # =============================================================
  integration:
    needs: [preflight, unit]
    if: needs.preflight.outputs.should-run == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-clangd: "true"
          install-bear: "true"

      - name: Preload tree-sitter parsers
        id: parsers
        uses: ./.github/actions/prewarm-parsers
        with:
          cold-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cold_parser_cache) }}

      - name: Run integration tests (parallel)
        id: integration-tests
        shell: bash -l {0}
        run: pytest -n 4 -m "integration and not slow" --tb=short --timeout=600 --durations=20

      - name: Remove run-scoped parser cache
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.cold_parser_cache))
        env:
          COLD_RUN_DIR: ${{ github.workspace }}/../.cache/tree-sitter-language-pack/cold/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [[ -n "$COLD_RUN_DIR" ]]; then
            rm -rf -- "$COLD_RUN_DIR"
          fi

  # =============================================================
  # Job 3 — Integration serial  (mutates repos, ~25 min)
  #   SCIP indexing, process_instance, git checkout/apply
  # =============================================================
  integration-serial:
    needs: [preflight, integration]
    if: needs.preflight.outputs.should-run == 'true' && needs.preflight.outputs.run-serial == 'true'
    runs-on: self-hosted
    timeout-minutes: 45
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Persist codenib cache across runs
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          mkdir -p "$CACHE_DIR"
          ln -sfn "$CACHE_DIR" "$HOME/.codenib"

      - name: Purge stale SCIP Python caches (one-time)
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          # Cleanup orphan v3 marker from an earlier graph-index iteration —
          # #120's _SCHEMA_VERSION check now handles graph.pkl invalidation,
          # so the ci-full.yml marker bump is no longer needed.
          rm -f "$CACHE_DIR/.scip-cache-v3"
          MARKER="$CACHE_DIR/.scip-cache-v2"
          if [ ! -f "$MARKER" ]; then
            echo "Purging stale SCIP Python graph caches..."
            find "$CACHE_DIR" -name "graph.pkl" -delete 2>/dev/null || true
            find "$CACHE_DIR" -name "index.scip" -delete 2>/dev/null || true
            find "$CACHE_DIR" -name "index.decoded" -delete 2>/dev/null || true
            touch "$MARKER"
          fi

      - name: Inspect codenib cache
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          echo "[cache] dir=$CACHE_DIR"
          du -sh "$CACHE_DIR" 2>/dev/null || true
          echo "[cache] graph.pkl count=$(find "$CACHE_DIR" -name graph.pkl 2>/dev/null | wc -l)"
          echo "[cache] index.scip count=$(find "$CACHE_DIR" -name index.scip 2>/dev/null | wc -l)"
          echo "[cache] index.decoded count=$(find "$CACHE_DIR" -name index.decoded 2>/dev/null | wc -l)"
          find "$CACHE_DIR" -maxdepth 2 -mindepth 1 -type d 2>/dev/null | head -40 || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-clangd: "true"
          install-bear: "true"

      - name: Run integration serial tests
        shell: bash -l {0}
        # SCIP outputs land at ~/.codenib/<instance_id>/ (conftest fixture
        # hard-codes this path; self-hosted runner's symlink makes it persist
        # so the downstream `scip-core` job sees it).
        #
        # --timeout=900: per-test hang guardrail. The slowest healthy serial test
        # is ~7.5 min, so a 15-min cap leaves 2x headroom yet fails a hung test
        # (e.g. scip-python indexing of sympy, observed hanging ~27 min) fast
        # instead of letting it run out the 45-min job cap and hog the single
        # self-hosted runner. Default (signal) method fails just the hung test.
        run: pytest -m "integration_serial" -x -v --tb=short --timeout=900 --durations=20

  # =============================================================
  # Job 3b — SCIP core  (builds core/ pybind + parity-checks the C++
  # decoder against the serial graphs persisted by integration-serial.
  # Depends on integration-serial having run first to populate
  # $CODENIB_SCIP_CACHE with graph_ref.pkl per language.)
  # =============================================================
  scip-core:
    needs: [preflight, integration-serial]
    if: needs.preflight.outputs.should-run == 'true' && needs.preflight.outputs.run-serial == 'true'
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Persist codenib cache across runs
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          mkdir -p "$CACHE_DIR"
          ln -sfn "$CACHE_DIR" "$HOME/.codenib"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-clangd: "true"
          install-bear: "true"

      - name: Install C++ build deps (re2, cmake)
        shell: bash -l {0}
        timeout-minutes: 5
        # libigraph is vendored via FetchContent in core/CMakeLists.txt
        # (see comment there) so we only need re2 + cmake from the system.
        run: |
          set -eu
          NEED=()
          command -v pkg-config >/dev/null 2>&1 || NEED+=(pkg-config)
          command -v cmake      >/dev/null 2>&1 || NEED+=(cmake)
          pkg-config --exists re2    2>/dev/null || NEED+=(libre2-dev)
          if [ ${#NEED[@]} -eq 0 ]; then
            echo "[deps] all present — skipping apt"
            exit 0
          fi
          echo "[deps] missing: ${NEED[*]}"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends "${NEED[@]}"

      - name: Install pybind11
        shell: bash -l {0}
        run: python -m pip install pybind11

      - name: Cache build/core
        uses: actions/cache@v4
        with:
          path: build/core
          # Reuse the build dir whenever core sources, CMakeLists, and the
          # vendored c-igraph pin are unchanged. c-igraph compile is the
          # bulk of the build cost (~30s on cold cache); cmake's own
          # incremental cache handles partial rebuilds when only our .cpp
          # files change.
          key: core-${{ runner.os }}-${{ hashFiles('core/**/*.cpp','core/**/*.h','core/CMakeLists.txt','core/bindings/*.cpp') }}
          restore-keys: |
            core-${{ runner.os }}-

      - name: Build core/ (pybind)
        shell: bash -l {0}
        run: |
          cmake -S core -B build/core \
            -DCMAKE_BUILD_TYPE=Release \
            -DCODENIB_BUILD_PYBIND=ON \
            -DPython_EXECUTABLE="$(which python)"
          cmake --build build/core -j "$(nproc)"

      - name: Run SCIP core parity tests
        shell: bash -l {0}
        env:
          PYTHONPATH: ${{ github.workspace }}/build/core
        # Force the dynamic loader to resolve libstdc++ against the same
        # GCC that compiled our pybind .so.  Any conda env on the runner
        # may carry an older libstdc++ whose GLIBCXX_* tags don't cover
        # the symbols our build references.
        #
        # (No libigraph PRELOAD needed: c-igraph is vendored privately
        # into codenib_core.so via --exclude-libs,ALL, so it cannot
        # clash with the c-igraph that Python's `igraph` wheel bundles.)
        run: |
          SYS_STDCPP="$(gcc -print-file-name=libstdc++.so.6 2>/dev/null || true)"
          if [ -e "$SYS_STDCPP" ]; then
            export LD_PRELOAD="$SYS_STDCPP"
            echo "[ld] LD_PRELOAD=$LD_PRELOAD"
          else
            echo "[ld] system libstdc++.so.6 not found via gcc; running without LD_PRELOAD"
          fi
          pytest test/scip/test_scip_core.py -v --tb=short

  # =============================================================
  # Job 5 — Graph cache consumer tests (~5 min)
  #
  # Reads graph.pkl written by integration-serial (specifically
  # test_scip_multilingual) and runs query / range / anchor checks against
  # it via skip_level="graph". Mirrors scip-core's job-level dependency on
  # integration-serial — runs in a separate job so the cached pickle is
  # always fresh from the most recent decoder.
  # =============================================================
  graph-consumer:
    needs: [preflight, integration-serial, scip-core]
    if: always() && needs.preflight.outputs.should-run == 'true' && needs.preflight.outputs.run-serial == 'true' && needs.integration-serial.result == 'success' && needs.scip-core.result != 'cancelled'
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Persist codenib cache across runs
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          mkdir -p "$CACHE_DIR"
          ln -sfn "$CACHE_DIR" "$HOME/.codenib"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup environment
        uses: ./.github/actions/setup-env
        with:
          install-clangd: "true"
          install-bear: "true"

      - name: Run graph consumer tests
        shell: bash -l {0}
        run: pytest -m "integration_serial_consumer" -v --tb=short

  # =============================================================
  # Job 4 — Slow tests  (LLM API, GPU embeddings, ~15 min)
  # =============================================================
  slow:
    needs: [preflight, unit, integration, integration-serial, scip-core, graph-consumer]
    if: always() && needs.preflight.outputs.should-run == 'true' && needs.preflight.outputs.run-slow == 'true' && needs.unit.result == 'success' && needs.integration.result == 'success' && (needs.integration-serial.result == 'success' || needs.integration-serial.result == 'skipped') && (needs.scip-core.result == 'success' || needs.scip-core.result == 'skipped') && (needs.graph-consumer.result == 'success' || needs.graph-consumer.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      CODENIB_CI_TMPDIR: ${{ github.workspace }}/../.tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/../.cache/pip
      npm_config_cache: ${{ github.workspace }}/../.cache/npm
      TMPDIR: ${{ github.workspace }}/../.tmp
      TMP: ${{ github.workspace }}/../.tmp
      TEMP: ${{ github.workspace }}/../.tmp
      VERTEXAI_PROJECT: ${{ vars.VERTEXAI_PROJECT }}
    steps:
      - name: Prepare temp HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$CODENIB_CI_TMPDIR"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "TMPDIR=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"
          echo "TEMP=$CODENIB_CI_TMPDIR" >> "$GITHUB_ENV"

      - name: Persist codenib cache across runs
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          mkdir -p "$CACHE_DIR"
          ln -sfn "$CACHE_DIR" "$HOME/.codenib"

      - name: Purge stale SCIP Python caches (one-time)
        run: |
          CACHE_DIR="${{ github.workspace }}/../.cache/codenib"
          # Cleanup orphan v3 marker from an earlier graph-index iteration —
          # #120's _SCHEMA_VERSION check now handles graph.pkl invalidation,
          # so the ci-full.yml marker bump is no longer needed.
          rm -f "$CACHE_DIR/.scip-cache-v3"
          MARKER="$CACHE_DIR/.scip-cache-v2"
          if [ ! -f "$MARKER" ]; then
            echo "Purging stale SCIP Python graph caches..."
            find "$CACHE_DIR" -name "graph.pkl" -delete 2>/dev/null || true
            find "$CACHE_DIR" -name "index.scip" -delete 2>/dev/null || true
            find "$CACHE_DIR" -name "index.decoded" -delete 2>/dev/null || true
            touch "$MARKER"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup GCP credentials
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          mkdir -p "$HOME/.config/gcloud"
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "::error::GOOGLE_APPLICATION_CREDENTIALS_JSON is required for the slow tier"
            exit 1
          fi
          CREDENTIALS_PATH="$HOME/.config/gcloud/application_default_credentials.json"
          printf '%s' "$GCP_CREDENTIALS_JSON" > "$CREDENTIALS_PATH"
          chmod 600 "$CREDENTIALS_PATH"
          python -m json.tool "$CREDENTIALS_PATH" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIALS_PATH" >> "$GITHUB_ENV"

      - name: Run slow tests (LLM + embedding)
        shell: bash -l {0}
        run: pytest -m "slow" --tb=short
