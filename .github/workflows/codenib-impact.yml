# Runs the impact comment on CodeNib's own pull requests, so the action is
# exercised by real changes before anyone else depends on it.
name: CodeNib Impact

on:
  pull_request:
    paths:
      - "**.py"
      - ".github/actions/impact/**"
      - ".github/workflows/codenib-impact.yml"

permissions:
  contents: read

concurrency:
  group: codenib-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    # A pull request from a fork has a read-only token and cannot comment.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Comment with what the change reaches
        uses: ./.github/actions/impact
