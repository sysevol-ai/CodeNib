name: TestPyPI Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    uses: ./.github/workflows/release-verify.yml
    permissions:
      contents: read

  publish-testpypi:
    name: Publish to TestPyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/codenib
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi-install:
    name: Verify installed TestPyPI artifact
    needs: publish-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download built distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Resolve release version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download and verify the TestPyPI wheel
        env:
          CODENIB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export FETCH_DIR="$RUNNER_TEMP/testpypi-download"
          mkdir -p "$FETCH_DIR"
          FOUND=0
          for attempt in $(seq 1 18); do
            rm -f "$FETCH_DIR"/*.whl
            if python -m pip download \
              --disable-pip-version-check \
              --no-cache-dir \
              --no-deps \
              --only-binary=:all: \
              --pre \
              --index-url https://test.pypi.org/simple/ \
              --dest "$FETCH_DIR" \
              "codenib==$CODENIB_VERSION"; then
              FOUND=1
              break
            fi
            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done
          test "$FOUND" = 1

          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          from scripts.verify_release_artifacts import select_compatible_wheel

          built = select_compatible_wheel(Path("dist"))
          fetched = select_compatible_wheel(Path(os.environ["FETCH_DIR"]))

          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          if digest(built) != digest(fetched):
              raise SystemExit("TestPyPI wheel does not match the verified build")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"TESTPYPI_WHEEL={fetched.resolve()}\n")
          PY

      - name: Install the registry wheel
        run: |
          SMOKE_VENV="$RUNNER_TEMP/codenib-testpypi-smoke"
          python -m venv "$SMOKE_VENV"
          echo "SMOKE_VENV=$SMOKE_VENV" >> "$GITHUB_ENV"
          echo "$SMOKE_VENV/bin" >> "$GITHUB_PATH"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          "$SMOKE_VENV/bin/python" -m pip install "$TESTPYPI_WHEEL"

      - name: Exercise the installed CLI
        working-directory: ${{ runner.temp }}
        env:
          CODENIB_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(codenib --version)" = "codenib $CODENIB_VERSION"
          codenib doctor --require core --require wiki
          python "$GITHUB_WORKSPACE/scripts/smoke_release_install.py"
