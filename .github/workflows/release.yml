name: Release

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-test.yml"
      - ".github/workflows/release-verify.yml"
      - "codenib/**"
      - "scripts/smoke_release_install.py"
      - "scripts/smoke_release_services.py"
      - "scripts/verify_release_artifacts.py"
      - "test/test_release_artifacts.py"
      - "web/**"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "MANIFEST.in"
      - "README.md"
      - "SECURITY.md"
      - "pyproject.toml"
      - "setup.py"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify release artifacts
    uses: ./.github/workflows/release-verify.yml
    permissions:
      contents: read

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: self-hosted
    environment:
      name: pypi
      url: https://pypi.org/p/codenib
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: publish-pypi
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodeNib $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag
