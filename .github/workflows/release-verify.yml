name: Release verification

on:
  workflow_call:
    inputs:
      full:
        description: Run the cross-version and installed-service matrix.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution
    # This job executes package and frontend build code from pull requests.
    # Keep it off the persistent self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Test packaged Wiki frontend
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Build source distribution
        run: |
          BUILD_VENV="$RUNNER_TEMP/codenib-release-sdist-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install --upgrade pip build
          "$BUILD_VENV/bin/python" -m build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-build-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-wheel:
    name: Build ${{ matrix.arch }} wheel
    needs: build-sdist
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
    steps:
      - name: Download source distribution
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-build-sdist
          path: source-dist

      - name: Resolve source distribution
        id: sdist
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          sources = list(Path("source-dist").glob("*.tar.gz"))
          if len(sources) != 1:
              raise SystemExit(f"expected one source distribution, found {sources!r}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"path={sources[0]}\n")
          PY

      - name: Set up QEMU for aarch64
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Build and smoke-test wheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: cp310-manylinux_${{ matrix.arch }}
          CIBW_CONTAINER_ENGINE: "docker; create_args: --cap-add SYS_PTRACE"
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_28_${{ matrix.arch }}
            -w {dest_dir} {wheel}
          CIBW_TEST_COMMAND: |
            python - <<'PY'
            import hashlib
            import os
            import platform
            import secrets
            import stat
            import time
            from pathlib import Path
            from tempfile import TemporaryDirectory

            import codenib._workspace_owner_impl as implementation
            from codenib import _workspace_owner

            assert platform.machine() == '${{ matrix.arch }}'
            assert implementation.workspace_owner_protocol_version == 5
            protocol_v5_symbols = (
                "capture_owner_destination_exact",
                "acquire_owner_replacement_lease_exact",
                "verify_owner_destination_binding_exact",
                "borrow_owner_parent_descriptor_exact",
                "borrow_owner_destination_descriptor_exact",
                "claim_owner_replacement_permit_exact",
                "provision_owner_replacement_exact",
                "verify_owner_replacement_binding_exact",
                "exchange_owner_replacement_exact",
            )
            assert all(
                callable(getattr(implementation, name, None))
                for name in protocol_v5_symbols
            )
            facade_v5_symbols = (
                "capture_owner_destination",
                "acquire_owner_replacement_lease",
                "verify_owner_destination_binding",
                "borrow_owner_parent_descriptor",
                "borrow_owner_destination_descriptor",
                "claim_owner_replacement_permit",
                "provision_owner_replacement",
                "verify_owner_replacement_binding",
                "exchange_owner_replacement",
                "_bind_owner_replacement_permit",
            )
            assert all(
                callable(getattr(_workspace_owner, name, None))
                for name in facade_v5_symbols
            )
            assert implementation.require_support() is None
            assert _workspace_owner.require_support() is None

            plan_digest = hashlib.sha256(b"cibuildwheel-protocol-v5").hexdigest()
            plan_digest_bytes = plan_digest.encode("ascii")
            directories = ((b"data", 0o700),)
            incumbent_payload = b"incumbent"
            candidate_payload = b"candidate"

            def deadline():
                return time.monotonic_ns() + 10_000_000_000

            def identity(path):
                metadata = path.stat()
                return metadata.st_dev, metadata.st_ino

            def prepare_replacement(authority, slot_name):
                destination = authority / "published"
                destination.mkdir(mode=0o700)
                destination.joinpath("incumbent.txt").write_bytes(
                    incumbent_payload
                )
                incumbent_identity = identity(destination)
                owner = _workspace_owner.create_owner()
                try:
                    _workspace_owner.capture_owner_destination(
                        owner,
                        os.fsencode(authority),
                        b"published",
                        deadline(),
                    )
                    assert _workspace_owner.owner_state(owner) == (
                        "destination-captured"
                    )
                    assert (
                        _workspace_owner.verify_owner_destination_binding(owner)
                        is None
                    )
                    incumbent_descriptor = (
                        _workspace_owner.borrow_owner_destination_descriptor(
                            owner
                        )
                    )
                    assert not os.get_inheritable(incumbent_descriptor)
                    _workspace_owner.acquire_owner_replacement_lease(
                        owner,
                        deadline(),
                    )
                    assert _workspace_owner.owner_state(owner) == (
                        "destination-leased"
                    )
                    parent_descriptor = (
                        _workspace_owner.borrow_owner_parent_descriptor(owner)
                    )
                    parent_metadata = os.fstat(parent_descriptor)
                    parent_identity = (
                        parent_metadata.st_dev,
                        parent_metadata.st_ino,
                    )
                    assert stat.S_ISDIR(parent_metadata.st_mode)
                    assert parent_identity == identity(authority)
                    assert not os.get_inheritable(parent_descriptor)
                    replacement_permit = (
                        _workspace_owner.claim_owner_replacement_permit(owner)
                    )
                    _workspace_owner.provision_owner_replacement(
                        owner,
                        slot_name,
                        plan_digest_bytes,
                        0o700,
                        directories,
                        deadline(),
                    )
                    assert _workspace_owner.owner_state(owner) == (
                        "replacement-provisioned"
                    )
                    _workspace_owner.verify_owner_adoption_binding(
                        owner,
                        os.fsencode(destination),
                        slot_name,
                        plan_digest_bytes,
                    )
                    candidate_descriptor = (
                        _workspace_owner.borrow_owner_root_descriptor(owner)
                    )
                    candidate_metadata = os.fstat(candidate_descriptor)
                    candidate_identity = (
                        candidate_metadata.st_dev,
                        candidate_metadata.st_ino,
                    )
                    assert stat.S_ISDIR(candidate_metadata.st_mode)
                    assert candidate_identity != incumbent_identity
                    assert not os.get_inheritable(candidate_descriptor)
                    _workspace_owner.mark_owner_adopted(owner)
                    _workspace_owner.begin_owner_file(
                        owner,
                        b"data",
                        b"result.json",
                        0o600,
                    )
                    _workspace_owner.write_owner_file(owner, candidate_payload)
                    record = _workspace_owner.finish_owner_file(owner, 0o600)
                    assert len(record) == 8
                    _workspace_owner.seal_owner_directories(owner)
                    assert _workspace_owner.owner_state(owner) == (
                        "replacement-adopted"
                    )
                    assert (
                        _workspace_owner.verify_owner_replacement_binding(owner)
                        is None
                    )
                    return (
                        owner,
                        replacement_permit,
                        parent_descriptor,
                        incumbent_descriptor,
                        candidate_descriptor,
                        incumbent_identity,
                        candidate_identity,
                        destination,
                        authority / os.fsdecode(slot_name),
                    )
                except BaseException:
                    if not _workspace_owner.owner_closed(owner):
                        _workspace_owner.abort_owner(owner)
                    raise

            with TemporaryDirectory() as temporary:
                root = Path(temporary)

                success_root = root / "success"
                success_root.mkdir(mode=0o700)
                success_slot_name = (
                    f".replacement-success-{secrets.token_hex(16)}".encode(
                        "ascii"
                    )
                )
                (
                    success_owner,
                    success_permit,
                    success_parent_descriptor,
                    success_incumbent_descriptor,
                    success_candidate_descriptor,
                    success_incumbent_identity,
                    success_candidate_identity,
                    success_destination,
                    success_slot,
                ) = prepare_replacement(success_root, success_slot_name)
                success_committed = False
                try:
                    success_receipt = (
                        _workspace_owner.exchange_owner_replacement(
                            success_permit,
                            success_slot_name,
                            b"published",
                            deadline(),
                        )
                    )
                    assert _workspace_owner.owner_state(success_owner) == (
                        "replacement-exchanged-unreceipted"
                    )
                    assert identity(success_destination) == (
                        success_candidate_identity
                    )
                    assert identity(success_slot) == success_incumbent_identity
                    assert (
                        success_destination / "data/result.json"
                    ).read_bytes() == candidate_payload
                    assert (
                        success_slot / "incumbent.txt"
                    ).read_bytes() == incumbent_payload
                    assert (
                        os.fstat(success_parent_descriptor).st_dev,
                        os.fstat(success_parent_descriptor).st_ino,
                    ) == identity(success_root)
                    assert (
                        os.fstat(success_incumbent_descriptor).st_dev,
                        os.fstat(success_incumbent_descriptor).st_ino,
                    ) == success_incumbent_identity
                    assert (
                        os.fstat(success_candidate_descriptor).st_dev,
                        os.fstat(success_candidate_descriptor).st_ino,
                    ) == success_candidate_identity
                    _workspace_owner.commit_owner_receipt(success_receipt)
                    _workspace_owner.commit_owner_receipt(success_receipt)
                    success_committed = True
                    assert _workspace_owner.owner_state(success_owner) == (
                        "replacement-receipted"
                    )
                    assert (
                        os.fstat(success_parent_descriptor).st_dev,
                        os.fstat(success_parent_descriptor).st_ino,
                    ) == identity(success_root)
                    assert (
                        os.fstat(success_incumbent_descriptor).st_dev,
                        os.fstat(success_incumbent_descriptor).st_ino,
                    ) == success_incumbent_identity
                    assert (
                        os.fstat(success_candidate_descriptor).st_dev,
                        os.fstat(success_candidate_descriptor).st_ino,
                    ) == success_candidate_identity
                finally:
                    if not _workspace_owner.owner_closed(success_owner):
                        if success_committed:
                            _workspace_owner.close_owner_exact(success_owner)
                        else:
                            _workspace_owner.abort_owner(success_owner)
                assert _workspace_owner.owner_closed(success_owner)
                assert _workspace_owner.owner_state(success_owner) == "closed"
                assert identity(success_destination) == success_candidate_identity
                assert identity(success_slot) == success_incumbent_identity

                rollback_root = root / "rollback"
                rollback_root.mkdir(mode=0o700)
                rollback_slot_name = (
                    f".replacement-rollback-{secrets.token_hex(16)}".encode(
                        "ascii"
                    )
                )
                (
                    rollback_owner,
                    rollback_permit,
                    rollback_parent_descriptor,
                    rollback_incumbent_descriptor,
                    rollback_candidate_descriptor,
                    rollback_incumbent_identity,
                    rollback_candidate_identity,
                    rollback_destination,
                    rollback_slot,
                ) = prepare_replacement(rollback_root, rollback_slot_name)
                try:
                    _workspace_owner.exchange_owner_replacement(
                        rollback_permit,
                        rollback_slot_name,
                        b"published",
                        deadline(),
                    )
                    assert _workspace_owner.owner_state(rollback_owner) == (
                        "replacement-exchanged-unreceipted"
                    )
                    assert identity(rollback_destination) == (
                        rollback_candidate_identity
                    )
                    assert identity(rollback_slot) == rollback_incumbent_identity
                    assert (
                        os.fstat(rollback_parent_descriptor).st_dev,
                        os.fstat(rollback_parent_descriptor).st_ino,
                    ) == identity(rollback_root)
                    assert (
                        os.fstat(rollback_incumbent_descriptor).st_dev,
                        os.fstat(rollback_incumbent_descriptor).st_ino,
                    ) == rollback_incumbent_identity
                    assert (
                        os.fstat(rollback_candidate_descriptor).st_dev,
                        os.fstat(rollback_candidate_descriptor).st_ino,
                    ) == rollback_candidate_identity
                    _workspace_owner.abort_owner(rollback_owner)
                finally:
                    if not _workspace_owner.owner_closed(rollback_owner):
                        _workspace_owner.abort_owner(rollback_owner)
                assert _workspace_owner.owner_closed(rollback_owner)
                assert _workspace_owner.owner_state(rollback_owner) == "closed"
                assert identity(rollback_destination) == (
                    rollback_incumbent_identity
                )
                assert identity(rollback_slot) == rollback_candidate_identity
                assert (
                    rollback_destination / "incumbent.txt"
                ).read_bytes() == incumbent_payload
                assert (
                    rollback_slot / "data/result.json"
                ).read_bytes() == candidate_payload
            PY

      - name: Upload wheel
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-build-wheel-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  limited-abi-compile:
    name: Strict CPython 3.10 limited-ABI compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Compile the native extension against the limited API
        run: |
          INCLUDE_DIR="$(python - <<'PY'
          import sysconfig

          print(sysconfig.get_config_var("INCLUDEPY"))
          PY
          )"
          cc \
            -std=c11 \
            -D_GNU_SOURCE=1 \
            -DPy_LIMITED_API=0x030A0000 \
            -Wall \
            -Wextra \
            -Werror \
            -fPIC \
            -I"$INCLUDE_DIR" \
            -c native/workspace_owner.c \
            -o "$RUNNER_TEMP/workspace-owner-limited-api.o"
          test -s "$RUNNER_TEMP/workspace-owner-limited-api.o"

  build:
    name: Inspect production distributions
    needs:
      - build-sdist
      - build-wheel
      - limited-abi-compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: python-build-*
          path: dist
          merge-multiple: true

      - name: Inspect Python distributions
        run: |
          BUILD_VENV="$RUNNER_TEMP/codenib-release-inspect-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$BUILD_VENV"
          "$BUILD_VENV/bin/python" -m pip install \
            --upgrade pip "jsonschema>=4,<5" twine
          "$BUILD_VENV/bin/python" -m twine check dist/*
          "$BUILD_VENV/bin/python" scripts/verify_release_artifacts.py dist

      - name: Validate MCP Registry metadata
        run: |
          BUILD_VENV="$RUNNER_TEMP/codenib-release-inspect-${{ github.run_id }}-${{ github.run_attempt }}"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 90 \
            --output "$RUNNER_TEMP/mcp-server.schema.json" \
            https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
          "$BUILD_VENV/bin/python" scripts/verify_mcp_registry.py \
            --schema-file "$RUNNER_TEMP/mcp-server.schema.json"

      - name: Validate production release ref
        if: github.ref_type == 'tag'
        run: |
          REMOTE_TAG_SHA="$(
            git ls-remote --refs origin "refs/tags/$GITHUB_REF_NAME" |
              cut -f1
          )"
          REMOTE_COMMIT_SHA="$(
            git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" |
              cut -f1
          )"
          test -n "$REMOTE_TAG_SHA"
          test -n "$REMOTE_COMMIT_SHA"
          test "$REMOTE_TAG_SHA" != "$REMOTE_COMMIT_SHA"
          test "$REMOTE_COMMIT_SHA" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$REMOTE_COMMIT_SHA" origin/main
          python scripts/verify_release_artifacts.py dist --tag "$GITHUB_REF_NAME"

      - name: Upload distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  source-smoke:
    name: Source install without native extension
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install source distribution without a compiler
        env:
          CC: /bin/false
        run: |
          SOURCE_VENV="$RUNNER_TEMP/codenib-release-source-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$SOURCE_VENV"
          echo "$SOURCE_VENV/bin" >> "$GITHUB_PATH"
          "$SOURCE_VENV/bin/python" -m pip install --upgrade pip
          "$SOURCE_VENV/bin/python" -m pip install --no-cache-dir dist/*.tar.gz

      - name: Exercise core and fail-closed workspace support
        working-directory: ${{ runner.temp }}
        run: |
          codenib --version
          codenib doctor --require core
          python "$GITHUB_WORKSPACE/scripts/smoke_release_install.py"
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          from tempfile import TemporaryDirectory

          if importlib.util.find_spec("codenib._workspace_owner_impl") is not None:
              raise SystemExit("source install unexpectedly built the native extension")

          from codenib import LocalWorkspaceProvider
          from codenib import _workspace_owner
          from codenib._captured_directory import UnsupportedWorkspaceCreation

          try:
              _workspace_owner.require_support()
          except RuntimeError:
              pass
          else:
              raise SystemExit("workspace support did not fail closed")

          with TemporaryDirectory() as root:
              provider = LocalWorkspaceProvider(Path(root))
              try:
                  provider.require_support()
              except UnsupportedWorkspaceCreation:
                  pass
              else:
                  raise SystemExit("local workspace provider did not fail closed")
          PY

  abi3-smoke:
    name: Native ABI3 smoke (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install the compatible ABI3 wheel
        run: |
          ABI3_VENV="$RUNNER_TEMP/codenib-release-abi3-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$ABI3_VENV"
          echo "$ABI3_VENV/bin" >> "$GITHUB_PATH"
          "$ABI3_VENV/bin/python" -m pip install --upgrade pip
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          "$ABI3_VENV/bin/python" -m pip install --no-deps "$WHEEL"

      - name: Exercise native ABI and local workspace lifecycle
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import stat
          import time
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import codenib._workspace_owner_impl as implementation
          from codenib import LocalWorkspaceProvider, PublishedWorkspaceReceiptOwner
          from codenib import _workspace_owner
          from codenib._captured_directory import (
              WorkspaceDirectory,
              WorkspaceFile,
              WorkspacePlan,
          )
          from codenib._workspace_provider import (
              StrictWorkspaceRequest,
              run_strict_workspace,
          )

          assert Path(implementation.__file__).name == "_workspace_owner_impl.abi3.so"
          assert implementation.workspace_owner_protocol_version == 5
          protocol_v5_symbols = (
              "capture_owner_destination_exact",
              "acquire_owner_replacement_lease_exact",
              "verify_owner_destination_binding_exact",
              "borrow_owner_parent_descriptor_exact",
              "borrow_owner_destination_descriptor_exact",
              "claim_owner_replacement_permit_exact",
              "provision_owner_replacement_exact",
              "verify_owner_replacement_binding_exact",
              "exchange_owner_replacement_exact",
          )
          assert all(
              callable(getattr(implementation, name, None))
              for name in protocol_v5_symbols
          )
          assert implementation.require_support() is None
          assert _workspace_owner.require_support() is None
          facade_v5_symbols = (
              "capture_owner_destination",
              "acquire_owner_replacement_lease",
              "verify_owner_destination_binding",
              "borrow_owner_parent_descriptor",
              "borrow_owner_destination_descriptor",
              "claim_owner_replacement_permit",
              "provision_owner_replacement",
              "verify_owner_replacement_binding",
              "exchange_owner_replacement",
              "_bind_owner_replacement_permit",
          )
          assert all(
              callable(getattr(_workspace_owner, name, None))
              for name in facade_v5_symbols
          )

          payload = b'{"release-smoke":"ok"}'
          with TemporaryDirectory() as temporary:
              root = Path(temporary) / "authority"
              root.mkdir(mode=0o700)
              root.chmod(0o700)
              assert stat.S_IMODE(root.stat().st_mode) == 0o700
              destination = root / "published"
              provider = LocalWorkspaceProvider(root)
              provider.require_support()
              receipt_owner = PublishedWorkspaceReceiptOwner()
              plan = WorkspacePlan(
                  subject_digest=hashlib.sha256(b"release-smoke").hexdigest(),
                  directories=(WorkspaceDirectory(Path("data")),),
                  files=(
                      WorkspaceFile(
                          Path("data/result.json"),
                          mode=0o600,
                          max_bytes=1 << 20,
                      ),
                  ),
              )
              request = StrictWorkspaceRequest(
                  purpose="release-smoke",
                  destination=destination,
                  plan=plan,
              )

              def write_and_publish(session):
                  record = session.write_file("data/result.json", (payload,))
                  return session.publish_validated(
                      lambda reader: (
                          record,
                          reader.capture_ownership(allow_empty_root=True),
                      )
                  )

              record, ownership = run_strict_workspace(
                  provider,
                  request,
                  receipt_owner=receipt_owner,
                  operation=write_and_publish,
              )
              output = destination / "data/result.json"
              assert record.sha256 == hashlib.sha256(payload).hexdigest()
              assert ownership.file_records == (record,)
              assert receipt_owner.active
              assert output.read_bytes() == payload

              receipt_owner.close()

              assert receipt_owner.closed
              incumbent_identity = (
                  destination.stat().st_dev,
                  destination.stat().st_ino,
              )
              replacement_name = (
                  f".replacement-{os.getpid()}-{time.monotonic_ns()}".encode("ascii")
              )
              replacement = root / os.fsdecode(replacement_name)
              replacement_payload = b'{"release-smoke":"replacement"}'
              captured_owner = _workspace_owner.create_owner()
              try:
                  _workspace_owner.capture_owner_destination(
                      captured_owner,
                      os.fsencode(root),
                      b"published",
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "destination-captured"
                  )
                  assert (
                      _workspace_owner.verify_owner_destination_binding(
                          captured_owner
                      )
                      is None
                  )
                  destination_descriptor = (
                      _workspace_owner.borrow_owner_destination_descriptor(
                          captured_owner
                      )
                  )
                  descriptor_metadata = os.fstat(destination_descriptor)
                  assert stat.S_ISDIR(descriptor_metadata.st_mode)
                  assert (
                      descriptor_metadata.st_dev,
                      descriptor_metadata.st_ino,
                  ) == incumbent_identity
                  assert not os.get_inheritable(destination_descriptor)

                  _workspace_owner.acquire_owner_replacement_lease(
                      captured_owner,
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "destination-leased"
                  )
                  parent_descriptor = (
                      _workspace_owner.borrow_owner_parent_descriptor(
                          captured_owner
                      )
                  )
                  parent_metadata = os.fstat(parent_descriptor)
                  assert stat.S_ISDIR(parent_metadata.st_mode)
                  assert (
                      parent_metadata.st_dev,
                      parent_metadata.st_ino,
                  ) == (root.stat().st_dev, root.stat().st_ino)
                  assert not os.get_inheritable(parent_descriptor)

                  replacement_permit = (
                      _workspace_owner.claim_owner_replacement_permit(
                          captured_owner
                      )
                  )
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "destination-leased"
                  )
                  _workspace_owner.provision_owner_replacement(
                      captured_owner,
                      replacement_name,
                      plan.digest.encode("ascii"),
                      plan.root_mode,
                      tuple(
                          (os.fsencode(item.path.as_posix()), item.mode)
                          for item in plan.directories
                      ),
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "replacement-provisioned"
                  )
                  _workspace_owner.verify_owner_adoption_binding(
                      captured_owner,
                      os.fsencode(destination),
                      replacement_name,
                      plan.digest.encode("ascii"),
                  )
                  _workspace_owner.verify_owner_replacement_binding(
                      captured_owner
                  )
                  replacement_descriptor = (
                      _workspace_owner.borrow_owner_root_descriptor(
                          captured_owner
                      )
                  )
                  replacement_metadata = os.fstat(replacement_descriptor)
                  replacement_identity = (
                      replacement_metadata.st_dev,
                      replacement_metadata.st_ino,
                  )
                  assert stat.S_ISDIR(replacement_metadata.st_mode)
                  assert replacement_identity != incumbent_identity
                  assert not os.get_inheritable(replacement_descriptor)

                  _workspace_owner.mark_owner_adopted(captured_owner)
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "replacement-adopted"
                  )
                  _workspace_owner.begin_owner_file(
                      captured_owner,
                      b"data",
                      b"result.json",
                      0o600,
                  )
                  _workspace_owner.write_owner_file(
                      captured_owner,
                      replacement_payload,
                  )
                  replacement_record = _workspace_owner.finish_owner_file(
                      captured_owner,
                      0o600,
                  )
                  assert len(replacement_record) == 8
                  _workspace_owner.seal_owner_directories(captured_owner)
                  _workspace_owner.verify_owner_replacement_binding(
                      captured_owner
                  )
                  assert replacement.joinpath("data/result.json").read_bytes() == (
                      replacement_payload
                  )

                  replacement_receipt = (
                      _workspace_owner.exchange_owner_replacement(
                          replacement_permit,
                          replacement_name,
                          b"published",
                          time.monotonic_ns() + 10_000_000_000,
                      )
                  )
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "replacement-exchanged-unreceipted"
                  )
                  assert (
                      destination.stat().st_dev,
                      destination.stat().st_ino,
                  ) == replacement_identity
                  assert (
                      replacement.stat().st_dev,
                      replacement.stat().st_ino,
                  ) == incumbent_identity
                  assert output.read_bytes() == replacement_payload
                  assert replacement.joinpath("data/result.json").read_bytes() == (
                      payload
                  )
                  assert (
                      os.fstat(parent_descriptor).st_dev,
                      os.fstat(parent_descriptor).st_ino,
                  ) == (root.stat().st_dev, root.stat().st_ino)
                  assert (
                      os.fstat(destination_descriptor).st_dev,
                      os.fstat(destination_descriptor).st_ino,
                  ) == incumbent_identity
                  assert (
                      os.fstat(replacement_descriptor).st_dev,
                      os.fstat(replacement_descriptor).st_ino,
                  ) == replacement_identity

                  _workspace_owner.commit_owner_receipt(replacement_receipt)
                  _workspace_owner.commit_owner_receipt(replacement_receipt)
                  assert _workspace_owner.owner_state(captured_owner) == (
                      "replacement-receipted"
                  )
                  assert (
                      os.fstat(parent_descriptor).st_dev,
                      os.fstat(parent_descriptor).st_ino,
                  ) == (root.stat().st_dev, root.stat().st_ino)
                  assert (
                      os.fstat(destination_descriptor).st_dev,
                      os.fstat(destination_descriptor).st_ino,
                  ) == incumbent_identity
                  assert (
                      os.fstat(replacement_descriptor).st_dev,
                      os.fstat(replacement_descriptor).st_ino,
                  ) == replacement_identity
              finally:
                  _workspace_owner.close_owner_exact(captured_owner)

              assert _workspace_owner.owner_closed(captured_owner)
              assert _workspace_owner.owner_state(captured_owner) == "closed"
              assert {path.name for path in root.iterdir()} == {
                  "published",
                  os.fsdecode(replacement_name),
              }
              assert (destination.stat().st_dev, destination.stat().st_ino) == (
                  replacement_identity
              )
              assert (replacement.stat().st_dev, replacement.stat().st_ino) == (
                  incumbent_identity
              )
              assert output.read_bytes() == replacement_payload
              assert replacement.joinpath("data/result.json").read_bytes() == payload

              rollback_incumbent_identity = (
                  destination.stat().st_dev,
                  destination.stat().st_ino,
              )
              rollback_name = (
                  f".rollback-{os.getpid()}-{time.monotonic_ns()}".encode("ascii")
              )
              rollback = root / os.fsdecode(rollback_name)
              rollback_payload = b'{"release-smoke":"rollback-candidate"}'
              rollback_owner = _workspace_owner.create_owner()
              try:
                  _workspace_owner.capture_owner_destination(
                      rollback_owner,
                      os.fsencode(root),
                      b"published",
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(rollback_owner) == (
                      "destination-captured"
                  )
                  _workspace_owner.verify_owner_destination_binding(
                      rollback_owner
                  )
                  rollback_incumbent_descriptor = (
                      _workspace_owner.borrow_owner_destination_descriptor(
                          rollback_owner
                      )
                  )
                  assert not os.get_inheritable(rollback_incumbent_descriptor)
                  _workspace_owner.acquire_owner_replacement_lease(
                      rollback_owner,
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(rollback_owner) == (
                      "destination-leased"
                  )
                  rollback_parent_descriptor = (
                      _workspace_owner.borrow_owner_parent_descriptor(
                          rollback_owner
                      )
                  )
                  rollback_parent_metadata = os.fstat(
                      rollback_parent_descriptor
                  )
                  assert stat.S_ISDIR(rollback_parent_metadata.st_mode)
                  assert (
                      rollback_parent_metadata.st_dev,
                      rollback_parent_metadata.st_ino,
                  ) == (root.stat().st_dev, root.stat().st_ino)
                  assert not os.get_inheritable(rollback_parent_descriptor)
                  rollback_permit = (
                      _workspace_owner.claim_owner_replacement_permit(
                          rollback_owner
                      )
                  )
                  _workspace_owner.provision_owner_replacement(
                      rollback_owner,
                      rollback_name,
                      plan.digest.encode("ascii"),
                      plan.root_mode,
                      tuple(
                          (os.fsencode(item.path.as_posix()), item.mode)
                          for item in plan.directories
                      ),
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(rollback_owner) == (
                      "replacement-provisioned"
                  )
                  _workspace_owner.verify_owner_adoption_binding(
                      rollback_owner,
                      os.fsencode(destination),
                      rollback_name,
                      plan.digest.encode("ascii"),
                  )
                  rollback_descriptor = (
                      _workspace_owner.borrow_owner_root_descriptor(
                          rollback_owner
                      )
                  )
                  rollback_metadata = os.fstat(rollback_descriptor)
                  rollback_identity = (
                      rollback_metadata.st_dev,
                      rollback_metadata.st_ino,
                  )
                  assert stat.S_ISDIR(rollback_metadata.st_mode)
                  assert rollback_identity != rollback_incumbent_identity
                  assert not os.get_inheritable(rollback_descriptor)
                  _workspace_owner.mark_owner_adopted(rollback_owner)
                  _workspace_owner.begin_owner_file(
                      rollback_owner,
                      b"data",
                      b"result.json",
                      0o600,
                  )
                  _workspace_owner.write_owner_file(
                      rollback_owner,
                      rollback_payload,
                  )
                  rollback_record = _workspace_owner.finish_owner_file(
                      rollback_owner,
                      0o600,
                  )
                  assert len(rollback_record) == 8
                  _workspace_owner.seal_owner_directories(rollback_owner)
                  assert _workspace_owner.owner_state(rollback_owner) == (
                      "replacement-adopted"
                  )
                  _workspace_owner.verify_owner_replacement_binding(
                      rollback_owner
                  )
                  _workspace_owner.exchange_owner_replacement(
                      rollback_permit,
                      rollback_name,
                      b"published",
                      time.monotonic_ns() + 10_000_000_000,
                  )
                  assert _workspace_owner.owner_state(rollback_owner) == (
                      "replacement-exchanged-unreceipted"
                  )
                  assert (
                      destination.stat().st_dev,
                      destination.stat().st_ino,
                  ) == rollback_identity
                  assert (
                      rollback.stat().st_dev,
                      rollback.stat().st_ino,
                  ) == rollback_incumbent_identity
                  assert output.read_bytes() == rollback_payload
                  assert rollback.joinpath("data/result.json").read_bytes() == (
                      replacement_payload
                  )
                  assert (
                      os.fstat(rollback_parent_descriptor).st_dev,
                      os.fstat(rollback_parent_descriptor).st_ino,
                  ) == (root.stat().st_dev, root.stat().st_ino)
                  assert (
                      os.fstat(rollback_incumbent_descriptor).st_dev,
                      os.fstat(rollback_incumbent_descriptor).st_ino,
                  ) == rollback_incumbent_identity
                  assert (
                      os.fstat(rollback_descriptor).st_dev,
                      os.fstat(rollback_descriptor).st_ino,
                  ) == rollback_identity
                  _workspace_owner.abort_owner(rollback_owner)
              finally:
                  if not _workspace_owner.owner_closed(rollback_owner):
                      _workspace_owner.abort_owner(rollback_owner)

              assert _workspace_owner.owner_closed(rollback_owner)
              assert _workspace_owner.owner_state(rollback_owner) == "closed"
              assert (
                  destination.stat().st_dev,
                  destination.stat().st_ino,
              ) == rollback_incumbent_identity
              assert (rollback.stat().st_dev, rollback.stat().st_ino) == (
                  rollback_identity
              )
              assert output.read_bytes() == replacement_payload
              assert rollback.joinpath("data/result.json").read_bytes() == (
                  rollback_payload
              )
          PY

  install-smoke:
    name: Install smoke (Python ${{ matrix.python-version }})
    if: inputs.full
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout smoke harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install wheel
        run: |
          SMOKE_VENV="$RUNNER_TEMP/codenib-release-smoke-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$SMOKE_VENV"
          echo "$SMOKE_VENV/bin" >> "$GITHUB_PATH"
          "$SMOKE_VENV/bin/python" -m pip install --upgrade pip
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          "$SMOKE_VENV/bin/python" -m pip install "$WHEEL"

      - name: Exercise installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          codenib --version
          codenib doctor --require core
          python "$GITHUB_WORKSPACE/scripts/smoke_release_install.py"

  upgrade-smoke:
    name: Upgrade from CodeNib 0.1
    if: inputs.full
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout upgrade harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Exercise the supported upgrade boundary
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          python scripts/smoke_release_upgrade.py \
            --wheel "$WHEEL" \
            --expected-version "$VERSION"

  service-smoke:
    name: Installed Wiki and MCP services
    if: inputs.full
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout service harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install wheel with MCP support
        run: |
          SERVICE_VENV="$RUNNER_TEMP/codenib-release-services-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$SERVICE_VENV"
          echo "$SERVICE_VENV/bin" >> "$GITHUB_PATH"
          "$SERVICE_VENV/bin/python" -m pip install --upgrade pip
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          "$SERVICE_VENV/bin/python" -m pip install "${WHEEL}[mcp]"

      - name: Verify optional runtime boundary
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util

          unexpected = [
              name
              for name in ("faiss", "igraph", "litellm", "sentence_transformers")
              if importlib.util.find_spec(name) is not None
          ]
          if unexpected:
              raise SystemExit(f"unexpected optional runtimes: {unexpected}")

          import sys
          import codenib.mcp.server

          eagerly_loaded = [
              name
              for name in ("faiss", "igraph", "litellm", "sentence_transformers")
              if name in sys.modules
          ]
          if eagerly_loaded:
              raise SystemExit(f"optional runtimes loaded eagerly: {eagerly_loaded}")
          PY

      - name: Exercise installed services
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_release_services.py"

  agent-smoke:
    name: Installed sparse Ask service
    if: inputs.full
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout agent harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install wheel with agent support
        run: |
          AGENT_VENV="$RUNNER_TEMP/codenib-release-agent-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$AGENT_VENV"
          echo "$AGENT_VENV/bin" >> "$GITHUB_PATH"
          "$AGENT_VENV/bin/python" -m pip install --upgrade pip
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          "$AGENT_VENV/bin/python" -m pip install "${WHEEL}[agent]"

      - name: Verify sparse agent dependency boundary
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util

          unexpected = [
              name
              for name in ("faiss", "igraph", "sentence_transformers")
              if importlib.util.find_spec(name) is not None
          ]
          if unexpected:
              raise SystemExit(f"unexpected retrieval runtimes: {unexpected}")
          if importlib.util.find_spec("litellm") is None:
              raise SystemExit("LiteLLM is missing from the agent extra")
          PY

      - name: Exercise installed Ask service
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_release_agent.py"

  graph-smoke:
    name: Installed CodeGraph and agent onboarding
    if: inputs.full
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout graph harness
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: python-package-distributions
          path: dist

      - name: Install wheel, Python graph runtime, and MCP
        run: |
          GRAPH_VENV="$RUNNER_TEMP/codenib-release-graph-${{ github.run_id }}-${{ github.run_attempt }}"
          python -m venv "$GRAPH_VENV"
          echo "$GRAPH_VENV/bin" >> "$GITHUB_PATH"
          "$GRAPH_VENV/bin/python" -m pip install --upgrade pip
          WHEEL="$(python scripts/verify_release_artifacts.py \
            dist --print-compatible-wheel)"
          "$GRAPH_VENV/bin/python" -m pip install "${WHEEL}[graph,mcp]"

      - name: Provision the Python SCIP provider
        run: |
          SCIP_ROOT="$RUNNER_TEMP/codenib-scip-python-${{ github.run_id }}-${{ github.run_attempt }}"
          npm install --prefix "$SCIP_ROOT" "@sourcegraph/scip-python@0.6.6"
          echo "$SCIP_ROOT/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify graph dependency boundary
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import importlib.util

          required = ("google.protobuf", "igraph", "mcp")
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"missing graph runtimes: {missing}")

          unexpected = [
              name
              for name in ("faiss", "litellm", "sentence_transformers")
              if importlib.util.find_spec(name) is not None
          ]
          if unexpected:
              raise SystemExit(f"unexpected non-graph runtimes: {unexpected}")
          PY

      - name: Exercise installed CodeGraph product path
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/scripts/smoke_release_graph.py"
