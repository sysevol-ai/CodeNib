name: Desktop app

on:
  pull_request:
    paths:
      - "desktop/**"
      - "codenib/**"
      - "web/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # Builds CodeNib.app for Apple silicon and a disk image to try it from.
    # Every binary carries the hardened runtime that notarization requires.
    # On main and manual runs, with the Apple secrets set (desktop/README.md,
    # "Sign and notarize"), the app and disk image are signed with a Developer
    # ID and notarized, so macOS opens them without asking. Otherwise they are
    # signed ad hoc and macOS asks once before the app first opens.
    name: Build the macOS app
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/app/package-lock.json
            web/package-lock.json

      - name: Test the app's Rust code
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Build the Wiki frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Import the Developer ID certificate
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/codenib-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" |
            awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$IDENTITY" ]]; then
            echo "the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          {
            echo "CODENIB_SIGN_IDENTITY=$IDENTITY"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "CODENIB_KEYCHAIN=$KEYCHAIN"
          } >> "$GITHUB_ENV"

      - name: Bundle Python and this CodeNib into the app
        run: desktop/scripts/bundle-python.sh

      - name: Build the app and disk image
        working-directory: desktop
        env:
          # Tauri signs the app as APPLE_SIGNING_IDENTITY and, with these set,
          # notarizes and staples it before it makes the disk image.
          APPLE_ID: ${{ env.DEVELOPER_ID == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.DEVELOPER_ID == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.DEVELOPER_ID == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          npm ci
          npm --prefix app ci
          npm run build

      - name: Check the bundle
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/CodeNib.app"
          ls "$APP/Contents/MacOS" | grep -q .
          test -f "$APP/Contents/Resources/icon.icns"
          /usr/libexec/PlistBuddy \
            -c "Print :NSAppTransportSecurity:NSAllowsLocalNetworking" \
            "$APP/Contents/Info.plist" | grep -qx true
          test -x "$APP/Contents/Resources/python/bin/python3.12"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP" 2>&1 | grep -E '^(Authority|Format|CodeDirectory)'
          du -sh "$APP"
          ls -la desktop/src-tauri/target/release/bundle/dmg/

      - name: Check every binary is ready for notarization
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/CodeNib.app"
          if [[ "$DEVELOPER_ID" == "true" ]]; then
            desktop/scripts/check-notarizable.sh --release "$APP"
          else
            desktop/scripts/check-notarizable.sh "$APP"
          fi

      - name: Run the app's own CodeNib on a repository
        run: desktop/scripts/smoke-bundle.sh desktop/src-tauri/target/release/bundle/macos/CodeNib.app

      - name: Sign, notarize and staple the disk image
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/CodeNib.app"
          DMG="$(ls desktop/src-tauri/target/release/bundle/dmg/*.dmg)"
          codesign --force --timestamp --sign "$CODENIB_SIGN_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG"

      - name: Upload the disk image
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: CodeNib-macos-apple-silicon
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove the signing keychain
        if: always() && env.DEVELOPER_ID == 'true'
        run: |
          if [[ -n "${CODENIB_KEYCHAIN:-}" ]]; then
            security delete-keychain "$CODENIB_KEYCHAIN"
          fi
