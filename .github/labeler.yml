# Auto-label PRs based on changed file paths.
# Labels map to the taxonomy defined in .github/labels.yml (see #122).
# See https://github.com/actions/labeler for syntax.

# ── scope/ ───────────────────────────────────────────────────────────
scope/agent:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/agent/**
          - test/agent/**

scope/chunking:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/code_chunking/**
          - test/chunker/**

scope/graph:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/graph/**
          - codeminer/ops/**
          - codeminer/scip_interface/**
          - codeminer/ls_index/**
          - test/graph/**
          - test/ops/**
          - test/scip/**

scope/indexing:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/index/**
          - test/index/**

scope/eval:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/dataset/**
          - codeminer/eval/**
          - test/dataset/**

scope/llm:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/llm/**

scope/compiler:
  - changed-files:
      - any-glob-to-any-file:
          - codeminer/compiler/**
          - test/compiler/**

scope/infra:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

# ── type/ ────────────────────────────────────────────────────────────
type/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**.md"
          - docs/**

type/test:
  - changed-files:
      - any-glob-to-any-file:
          - test/**
          - conftest.py

type/chore:
  - changed-files:
      - any-glob-to-any-file:
          - requirements*.txt
          - setup.py
          - setup.cfg
          - pyproject.toml
          - .github/**
