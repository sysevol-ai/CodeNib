# Auto-label PRs based on changed file paths.
# Labels follow the prefix-based taxonomy defined in .github/labels.yml.
# See https://github.com/actions/labeler

# ── scope/ ───────────────────────────────────────────────────────────
scope/agent:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/agent/**
          - test/agent/**

scope/chunking:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/code_chunking/**
          - test/chunker/**

scope/graph:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/graph/**
          - codenib/ops/**
          - codenib/scip_interface/**
          - codenib/ls_index/**
          - test/graph/**
          - test/ops/**
          - test/scip/**

scope/indexing:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/index/**
          - test/index/**

scope/llm:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/llm/**

scope/compiler:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/compiler/**
          - test/compiler/**

scope/eval:
  - changed-files:
      - any-glob-to-any-file:
          - codenib/dataset/**
          - codenib/eval/**
          - test/dataset/**

scope/infra:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

# ── type/ ────────────────────────────────────────────────────────────
type/docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**.md"
          - docs/**

type/test:
  - changed-files:
      - any-glob-to-any-file:
          - test/**
          - conftest.py

type/chore:
  - changed-files:
      - any-glob-to-any-file:
          - requirements*.txt
          - setup.py
          - setup.cfg
          - pyproject.toml
          - .github/**
