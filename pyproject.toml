[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeminer"
version = "0.1.0"
description = "A code analysis agent with graph-enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Zhongming Yu", email = "zhy025@ucsd.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "igraph>=0.11.6",                     # For graph data structure and algorithms
    "matplotlib>=3.4.0",                  # For visualization of graphs
    "pytest>=6.0.0",                      # For testing
    "rank_bm25>=0.2.2",                    # For best match
    "langchain>=1.0.0,<1.1.0",             # Core LangChain runtime (v1+)
    "langchain-core>=1.0.4,<1.1.0",        # Shared LangChain schemas/runnables
    "langchain-community>=0.4.1,<0.5.0",   # Community integrations (BM25, FAISS)
    "langchain-text-splitters>=1.0.0,<1.1.0",  # Standalone splitters package in v1
    "langchain-openai>=1.0.2,<1.1.0",      # OpenAI embeddings (vector_store.py)
    "litellm>=1.40.0",                     # Lightweight LLM provider abstraction
    "langchain-huggingface>=1.0.1,<1.1.0", # HuggingFace embeddings/Runnables
    "pymilvus>=2.6.0",                    # For Milvus vector database with BM25 support
    "faiss-cpu>=1.7.0",                   # For FAISS similarity search
    "sentence-transformers>=2.2.0",       # For code-text similarity
    "einops>=0.8.0",                      # Required by current sentence-transformers embedding models
    "tree-sitter>=0.25.2",               # For standard Parser/Tree/Node APIs
    "tree-sitter-language-pack>=1.8.1,<1.9.0",  # Keep tree_sitter.Language ABI for chunkers
    "fastapi>=0.100.0",                   # For API endpoints
    "pydantic>=2.0.0",                    # For data validation
    "uvicorn>=0.20.0",                    # ASGI server for FastAPI
    "rich>=14.0.0",                       # For enhanced terminal output
    "datasets>=4.0.0",                    # For dataset handling and loading (4.0+ for List feature type)
    "PyStemmer>=3.0.0",                 # For stemmer (faster than NLTK)
    # "vllm>=0.10.2" removed — use vLLM OpenAI-compatible server via litellm
    "requests>=2.25.0",                 # For HTTP requests (health checks, etc.)
    "mcp>=1.0.0",                       # Model Context Protocol SDK (FastMCP stdio server)
    "pyyaml>=6.0",                      # Skill config + demo config parsing
]

[project.scripts]
codeminer-mcp = "codeminer.mcp.server:main"
codeminer-web = "codeminer.web.app:main"
codeminer-lsp-provider-validate = "codeminer.eval.agent_runner.lsp_provider_cli:main"
codeminer-lsp-replay-benchmark = "codeminer.eval.agent_runner.lsp_replay_benchmark:main"

[project.optional-dependencies]
dev = [
    "black>=22.3.0",
    "isort>=5.10.1",
    "mypy>=0.950",
    "flake8>=4.0.1",
    "flake8-bugbear>=24.4.0",
    "mkdocs-material>=9.5.0",
]
test = ["pytest>=6.0.0", "pytest-cov>=3.0.0", "pytest-xdist>=3.0.0", "pytest-timeout>=2.1.0", "filelock>=3.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["codeminer*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["eval*"]  # exclude packages matching these glob patterns

[tool.setuptools.package-data]
"codeminer.scip_interface" = ["*.proto", "*.yml", "*.sh", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
norecursedirs = [
    "third_party",
    ".git",
    ".cache",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
]
markers = [
    "slow: marks tests that need LLM API, GPU, or HuggingFace downloads (deselect with '-m \"not slow\"')",
    "integration: marks tests that use external repos but are read-only / parallel-safe (chunkers, fixture-based SCIP)",
    "integration_serial: marks tests that mutate shared repos (process_instance, git checkout/apply) and must run sequentially",
    "integration_serial_consumer: marks tests that consume graph.pkl written by integration_serial (run in a separate job after integration-serial via job-level needs, mirroring scip-core)",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    build
  | dist
  | third_party
  | docs/_build
  | .*\.egg-info
)/
'''
