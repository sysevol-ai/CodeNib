[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codenib"
version = "0.1.0"
description = "Multi-view repository context serving for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Zhongming Yu", email = "zhy025@ucsd.edu" }]
keywords = [
    "code-search",
    "coding-agents",
    "model-context-protocol",
    "repository-context",
    "static-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rank_bm25>=0.2.2",
    "rich>=14.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=1.8.1,<1.9.0",
    "uvicorn>=0.20.0",
]

[project.urls]
Documentation = "https://sysevol-ai.github.io/CodeNib/"
Homepage = "https://github.com/sysevol-ai/CodeNib"
Issues = "https://github.com/sysevol-ai/CodeNib/issues"
Repository = "https://github.com/sysevol-ai/CodeNib.git"

[project.scripts]
codenib = "codenib.cli:main"
codenib-mcp = "codenib.mcp.server:main"
codenib-web = "codenib.web.app:main"
codenib-lsp-provider-validate = "codenib.eval.agent_runner.lsp_provider_cli:main"
codenib-lsp-replay-benchmark = "codenib.eval.agent_runner.lsp_replay_benchmark:main"
codenib-prebuilt-normalize-graphs = "codenib.eval.agent_runner.prebuilt:main"
codenib-lsp-agent-ab = "codenib.eval.agent_runner.lsp_agent_ab:main"
codenib-lsp-provider-protocol-check = "codenib.eval.agent_runner.lsp_agent_ab:main"
codenib-lsp-agent-study-manifest = "codenib.eval.agent_runner.lsp_agent_study_manifest:main"
codenib-lsp-agent-study-artifacts = "codenib.eval.agent_runner.lsp_agent_study_artifacts:main"
codenib-lsp-agent-study-run = "codenib.eval.agent_runner.lsp_agent_study_runner:main"
codenib-artifact-bundle = "codenib.eval.artifact_bundle:main"

[project.optional-dependencies]
agent = [
    "litellm>=1.40.0",
]
datasets = [
    "datasets>=4.0.0",
]
graph = [
    "igraph>=0.11.6",
    "protobuf>=3.20.0",
]
mcp = [
    "mcp>=1.0.0",
]
semantic = [
    "einops>=0.8.0",
    "faiss-cpu>=1.7.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
]
zoekt = [
    "requests>=2.25.0",
]
full = [
    "datasets>=4.0.0",
    "einops>=0.8.0",
    "faiss-cpu>=1.7.0",
    "igraph>=0.11.6",
    "litellm>=1.40.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "protobuf>=3.20.0",
    "requests>=2.25.0",
    "sentence-transformers>=2.2.0",
]
dev = [
    "black>=22.3.0",
    "build>=1.2.0",
    "isort>=5.10.1",
    "mypy>=0.950",
    "flake8>=4.0.1",
    "flake8-bugbear>=24.4.0",
    "mkdocs-material>=9.5.0",
]
test = [
    "datasets>=4.0.0",
    "einops>=0.8.0",
    "faiss-cpu>=1.7.0",
    "filelock>=3.0.0",
    "igraph>=0.11.6",
    "litellm>=1.40.0",
    "matplotlib>=3.4.0",
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "protobuf>=3.20.0",
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
    "requests>=2.25.0",
    "sentence-transformers>=2.2.0",
    "tomli>=1.1.0; python_version < '3.11'",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["codenib*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["eval*"]  # exclude packages matching these glob patterns

[tool.setuptools.package-data]
"codenib.agent.skills" = ["*/config.yaml", "*/skill.md"]
"codenib.scip_interface" = ["*.proto", "*.yml", "*.sh", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
norecursedirs = [
    "third_party",
    ".git",
    ".cache",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
]
markers = [
    "slow: marks tests that need LLM API, GPU, or HuggingFace downloads (deselect with '-m \"not slow\"')",
    "integration: marks tests that use external repos but are read-only / parallel-safe (chunkers, fixture-based SCIP)",
    "integration_serial: marks tests that mutate shared repos (process_instance, git checkout/apply) and must run sequentially",
    "integration_serial_consumer: marks tests that consume graph.pkl written by integration_serial (run in a separate job after integration-serial via job-level needs, mirroring scip-core)",
]

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    build
  | dist
  | third_party
  | docs/_build
  | .*\.egg-info
)/
'''
