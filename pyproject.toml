[build-system]
requires = [
    "scikit-build-core>=0.3.3",
    "pybind11>=2.10.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "codeminer"
version = "0.1.0"
description = "A code analysis agent with graph-enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Zhongming Yu", email = "zhy025@ucsd.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "igraph>=0.11.6",                     # For graph data structure and algorithms
    "matplotlib>=3.4.0",                  # For visualization of graphs
    "pytest>=6.0.0",                      # For testing
    "rank_bm25>=0.2.2",                    # For best match
    "langchain>=1.0.0,<1.1.0",             # Core LangChain runtime (v1+)
    "langchain-core>=1.0.4,<1.1.0",        # Shared LangChain schemas/runnables
    "langchain-community>=0.4.1,<0.5.0",   # Community integrations (BM25, FAISS)
    "langchain-text-splitters>=1.0.0,<1.1.0",  # Standalone splitters package in v1
    "langchain-anthropic>=1.0.2,<1.1.0",   # Anthropic LLM bindings
    "langchain-openai>=1.0.2,<1.1.0",      # OpenAI LLM bindings
    "langchain-google-vertexai>=3.0.3,<4.0.0",  # Vertex AI LLM bindings
    "langchain-huggingface>=1.0.1,<1.1.0", # HuggingFace embeddings/Runnables
    "pymilvus>=2.6.0",                    # For Milvus vector database with BM25 support
    "faiss-cpu>=1.7.0",                   # For FAISS similarity search
    "sentence-transformers>=2.2.0",       # For code-text similarity
    "tree-sitter-language-pack>=0.1.0",  # For code parsing with tree-sitter
    "fastapi>=0.100.0",                   # For API endpoints
    "pydantic>=2.0.0",                    # For data validation
    "uvicorn>=0.20.0",                    # ASGI server for FastAPI
    "rich>=14.0.0",                       # For enhanced terminal output
    "datasets>=3.5.0",                    # For dataset handling and loading
    "PyStemmer>=3.0.0",                 # For stemmer (faster than NLTK)
    "vllm>=0.10.2",                     # For vllm
    "requests>=2.25.0",                 # For HTTP requests (health checks, etc.)
]

[project.optional-dependencies]
dev = [
    "black>=22.3.0",
    "isort>=5.10.1",
    "mypy>=0.950",
    "flake8>=4.0.1",
    "flake8-bugbear>=24.4.0",
]
test = ["pytest>=6.0.0", "pytest-cov>=3.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["codeminer*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["eval*"]  # exclude packages matching these glob patterns

[tool.setuptools.package-data]
"codeminer.scip_interface" = ["*.proto", "*.yml", "*.sh", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test"]
norecursedirs = [
    "third_party",
    ".git",
    ".cache",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
]

[tool.scikit-build]
cmake.source-dir = "core"
cmake.build-type = "Release"
cmake.version = ">=3.15"
cmake.args = [
    "-DBUILD_PYTHON_BINDINGS=ON",
    "-DCODEMINER_ENABLE_O3=ON",
]
# Exclude CMake build artifacts and test executables from the wheel
wheel.exclude = ["*.cmake", "CMakeFiles/**", "scip_decode_test*", "scip_decode_repo*", "libcodeminer_core.a"]
wheel.packages = ["codeminer"]

[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
CODEMINER_ENABLE_O3 = "ON"

[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
/(
    build
  | dist
  | third_party
  | docs/_build
  | .*\.egg-info
)/
'''
