site_name: CodeNib
site_description: A multi-view data system for serving repository context to coding agents
site_url: https://docs.codenib.ai/
repo_url: https://github.com/sysevol-ai/CodeNib
repo_name: sysevol-ai/CodeNib

# Keep engineering plans, experiment logs, and publisher-only procedures in the
# repository without publishing them on docs.codenib.ai. These patterns apply
# to every generated artifact, including Markdown, JSON, images, search, and the
# sitemap.
exclude_docs: |
  experiments/
  product_roadmap.md
  storage_backend_roadmap.md
  cognitive_debt_roadmap.md
  agent_runner_architecture_goal.md
  agent_compile_design.md
  scip_multilanguage_roadmap.md
  upload_dataset_to_huggingface.md
  diagnose_query_leak.md
  codenib_namespace_migration.md

theme:
  name: material
  font: false
  logo: assets/images/codenib-icon.svg
  # Use a versioned PNG so browsers do not retain the favicon served before
  # the GitHub Pages cutover. docs/favicon.ico remains the legacy fallback.
  favicon: assets/images/codenib-favicon-v2.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    # `prune` replaces `expand`, which the theme documents as incompatible.
    # Material inlines the generated API tree into every page, so keep the
    # navigation compact instead of expanding every API entry by default.
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - api-autonav:
      modules:
        - codenib
      nav_section_title: API Reference
      api_root_uri: api
      exclude_private: true
      # Internal tooling also contains implicit namespace packages. Skip them
      # without changing runtime package boundaries merely for documentation.
      on_implicit_namespace_package: skip
      exclude:
        # api-autonav 0.4 accepts directory roots rather than individual Python
        # files. Enforce an exact, positive public-module allowlist by rejecting
        # every descendant that is not named here. This also keeps future
        # internal modules private by default.
        - >-
          re:(?x)^codenib\.
          (?!
            (?:
              agent
              | agent\.skills
              | agent\.skills\.context
              | agent\.tools
              | code_chunking
              | compiler
              | graph
              | index
              | index\.embedding
              | integrations
              | integrations\.(?:locagent|orcaloca)
              | languages
              | llm
              | mcp
              | model
              | ops
              | ops\.(?:expand|filter|rerank|retrieve|transform)
              | sandbox
              | scip_interface
              | search
              | types
              | web\.local
              | wiki
            )$
          ).*$
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_section_style: table
            # Types come from annotations (94% of public signatures are
            # annotated), so a missing docstring type is not a defect.
            # Reject stale or misspelled docstring parameters that do not exist
            # in the signature. This does not check for missing parameter docs.
            docstring_options:
              ignore_init_summary: true
              warn_missing_types: false
              warn_unknown_params: true
            filters: public
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_bases: true
            show_labels: true
            summary: true
            unwrap_annotated: true
            modernize_annotations: true
            line_length: 88

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

