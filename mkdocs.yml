site_name: CodeNib
site_description: A multi-view data system for serving repository context to coding agents
site_url: https://docs.codenib.ai/
repo_url: https://github.com/sysevol-ai/CodeNib
repo_name: sysevol-ai/CodeNib

# Keep engineering plans, experiment logs, and publisher-only procedures in the
# repository without publishing them on docs.codenib.ai. These patterns apply
# to every generated artifact, including Markdown, JSON, images, search, and the
# sitemap.
exclude_docs: |
  experiments/
  product_roadmap.md
  agent_runner_architecture_goal.md
  agent_compile_design.md
  scip_multilanguage_roadmap.md
  upload_dataset_to_huggingface.md
  diagnose_query_leak.md
  codenib_namespace_migration.md

theme:
  name: material
  font: false
  logo: assets/images/codenib-icon.svg
  favicon: assets/images/codenib-icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    # `prune` replaces `expand`, which the theme documents as incompatible.
    # The generated API reference adds ~280 nav entries, and Material inlines
    # the whole tree into every page: expanding all of them buried the current
    # page inside unrelated subtrees and tripled page weight.
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search
  - api-autonav:
      modules:
        - codenib
      nav_section_title: API Reference
      api_root_uri: api
      exclude_private: true
      exclude:
        - re:codenib\..*_pb2(_grpc)?$
        # `exclude_docs` below drops any directory named `experiments/`, which
        # also matches the generated `api/codenib/eval/experiments/` pages.
        # Skip the package here so the nav never points at a dropped page.
        - codenib.eval.experiments
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_section_style: table
            # Types come from annotations (94% of public signatures are
            # annotated), so a missing docstring type is not a defect.
            # An undocumented-but-declared parameter is: keep that one as a
            # lint gate, since `mkdocs build --strict` turns it into a failure.
            docstring_options:
              ignore_init_summary: true
              warn_missing_types: false
              warn_unknown_params: true
            filters: public
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_root_heading: true
            show_root_full_path: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_bases: true
            show_labels: true
            summary: true
            unwrap_annotated: true
            modernize_annotations: true
            line_length: 88

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - User Guide:
      - Quickstart: quickstart.md
      - MCP Server: mcp.md
      - Web UI: web_demo.md
      - Running Locally: running-locally.md
      - Language Capabilities: language_capabilities.md
      - Agent Skills: agent_skills.md
      - Agent Integrations: agent_integrations.md
      - RAG Ops And Planner: rag_ops.md
  - Concepts:
      - SCIP Index: scip_index.md
      - CodeGraph Hierarchy Model: codegraph_hierarchy_model.md
      - Graph Range Query: graph_query.md
      - Regex Index: regex_index.md
      - Graph Cache: graph_cache_usage.md
      - Incremental Graph:
          - Overview: incremental_graph/index.md
          - Interactive Demo: incremental_graph/interactive.md
      - Core C++ Backend: core_cpp.md
  - Development:
      - Contributing a Language: contributing-a-language.md
      - Naming: branding.md
      - CI/CD: ci_cd.md
      - Releasing: releasing.md
  - Evaluation:
      - SWE-bench Collection: collect_swebench.md
      - Synthesis Pipeline: synthesis_pipeline.md
      - GT Locator: gt_locator.md
      - Evaluation Artifact Bundles: evaluation_artifacts.md
