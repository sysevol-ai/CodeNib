site_name: CodeMiner
site_description: A code analysis agent with graph-enhancement
repo_url: https://github.com/sysevol-ai/CodeMiner
repo_name: sysevol-ai/CodeMiner

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Guides:
      - SWE-bench Collection: collect_swebench.md
      - Upload to HuggingFace: upload_dataset_to_huggingface.md
      - CI/CD: ci_cd.md
  - Components:
      - GT Locator: gt_locator.md
      - Incremental Graph:
          - incremental_graph/index.md
          - Interactive Demo: incremental_graph/interactive.md
      - Regex Index: regex_index.md
      - SCIP Index: scip_index.md
      - Graph Cache: graph_cache_usage.md
