site_name: CodeNib
site_description: Source-linked repository context for coding agents and developers
site_url: https://sysevol-ai.github.io/CodeNib/
repo_url: https://github.com/sysevol-ai/CodeNib
repo_name: sysevol-ai/CodeNib

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - MCP Server: mcp.md
      - Web UI: web_demo.md
      - Running Locally: running-locally.md
      - Language Capabilities: language_capabilities.md
  - Core Concepts:
      - SCIP Index: scip_index.md
      - CodeGraph Hierarchy Model: codegraph_hierarchy_model.md
      - Graph Range Query: graph_query.md
      - Regex Index: regex_index.md
      - Graph Cache: graph_cache_usage.md
      - Incremental Graph:
          - Overview: incremental_graph/index.md
          - Interactive Demo: incremental_graph/interactive.md
      - Core C++ Backend: core_cpp.md
  - Guides:
      - SWE-bench Collection: collect_swebench.md
      - Synthesis Pipeline: synthesis_pipeline.md
      - Upload to HuggingFace: upload_dataset_to_huggingface.md
      - Diagnose Query Leak: diagnose_query_leak.md
      - Contributing a Language: contributing-a-language.md
  - Agent And Retrieval:
      - Agent Skills: agent_skills.md
      - RAG Ops And Planner: rag_ops.md
      - Agent Runner Architecture Goal: agent_runner_architecture_goal.md
      - Agent Compile (Design): agent_compile_design.md
      - GT Locator: gt_locator.md
  - Operations:
      - Naming: branding.md
      - Releasing: releasing.md
      - Namespace Migration: codenib_namespace_migration.md
      - CI/CD: ci_cd.md
      - Evaluation Artifact Bundles: evaluation_artifacts.md
      - SCIP Multi-Language Roadmap: scip_multilanguage_roadmap.md
  - Experiments:
      - Agent Compile Sweep: experiments/agent_compile.md
      - Compact Pre-load: experiments/compact_preload.md
      - Agent Runtime Probe: experiments/agent_runtime.md
      - Local Model Backend: experiments/qwen_backend.md
      - LSP Core Acceleration Gate: experiments/lsp_core_acceleration.md
      - LSP-route Adoption: experiments/lsp_route_adoption.md
      - Systems Paper Plan: experiments/system_paper_plan.md
