<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 262" width="830" height="262" role="img" aria-labelledby="t d">
<title id="t">Input tokens on 76 pull request takeovers</title>
<desc id="d">Two pairs of bars. With Codex on gpt-6.1-sol, the context prepared by codenib threads used 21% fewer input tokens than the agent reading the thread with gh. With Claude Code on Claude Opus 5.5 it used 45% fewer.</desc>
<defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker><style>@font-face{font-family:'Geist';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}.agent{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:17px;font-weight:620;fill:#f0f6fc;}.model{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9198a1;}.row{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:400;fill:#9198a1;}.row-on{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:560;fill:#f0f6fc;}.change{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:24px;font-weight:650;fill:#4493f8;letter-spacing:-0.02em;}</style></defs>
<text x="0.0" y="16.0" class="agent">Codex</text>
<text x="64.1" y="16.0" class="model">gpt-6.1-sol</text>
<text x="0.0" y="57.0" class="row">reads with gh</text>
<rect x="168.0" y="38.0" width="500.0" height="28.0" rx="4" fill="#656c76"/>
