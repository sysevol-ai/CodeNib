<svg data-theme="dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 338" width="830" height="338" role="img" aria-labelledby="t d">
<title id="t">One read of a GitHub thread instead of a tool call per piece</title>
<desc id="d">Top: an agent reading a thread itself makes six calls, for the issue, its comments, the linked pull request, the reviews, the checks and a failed log. Each call sends the conversation so far again, so the sixth call sends the most. Bottom: codenib threads writes the same six pieces into one document, THREAD_CONTEXT.md, which the agent reads once. The bar lengths sketch the mechanism; they are not measurements.</desc>
<defs><marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#80868b"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f93ee"/></marker><marker id="arrow-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2aa8e0"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d9c8f"/></marker><marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8eaed"/></marker><style>@font-face{font-family:'Geist';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Geist Mono';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}.group{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:600;fill:#e8eaed;}.group-r{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:600;fill:#5fd4c4;}.piece{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:15px;font-weight:400;fill:#e8eaed;}.file{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:14px;font-weight:500;fill:#e8eaed;}.num{font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:400;fill:#bdc1c6;}.legend{font-family:Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;font-size:13.5px;font-weight:400;fill:#bdc1c6;}</style></defs>
