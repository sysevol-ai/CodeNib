#
# Connects DeepSeek Harness to CodeNib's MCP server for the checkout dsh runs
# in. The search index is built or refreshed first; CodeNib keeps it under
# ~/.codenib, never in the checkout, and prepares the code graph on first use.
# Only the MCP protocol may reach stdout, so everything else goes to stderr.
# The same steps as plugins/codenib/scripts/mcp.sh, the Claude Code launcher.
- insert:
    - id: codenib
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codenib
        transport: stdio
        command: sh
        args:
          - -c
          - |
            set -eu
            if ! root="$(git rev-parse --show-toplevel 2>/dev/null)"; then
              echo "CodeNib serves Git checkouts; start dsh inside one." >&2
              exit 1
            fi
            # CodeNib before 0.2.5 does not know the options passed below.
            if command -v codenib >/dev/null 2>&1 &&
              codenib mcp --help 2>/dev/null | grep -q -- '--defer-graph'; then
              set -- codenib
            elif command -v uvx >/dev/null 2>&1; then
              set -- uvx --quiet --from "codenib[graph,mcp]>=0.2.5" codenib
            elif command -v codenib >/dev/null 2>&1; then
              echo "The installed CodeNib is older than 0.2.5: python -m pip install -U 'codenib[graph,mcp]'" >&2
              exit 1
            else
              echo "CodeNib is not installed: python -m pip install 'codenib[graph,mcp]'" >&2
              exit 1
            fi
            "$@" index "$root" --preset fast >&2
            exec "$@" mcp "$root" --defer-graph --tool-surface explore
